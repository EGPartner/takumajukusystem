<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タクマ塾 管理システム ログイン</title>
<style>
  :root{
    --bg:#F6F6F1; --surface:#FFFFFF; --border:#E1E7E7; --border-strong:#C7D2D2;
    --text-primary:#12181A; --text-secondary:#5B6668; --text-muted:#8A9799;
    --accent:#0FB8C4; --accent-dark:#0A8A93; --accent-bg:#E3F7F8;
    --danger:#D6483F; --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Hiragino Sans","Yu Gothic",-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text-primary);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:26px 24px;max-width:380px;width:100%;}
  h1{font-size:19px;margin:0 0 4px;text-align:center;}
  p.sub{font-size:13px;color:var(--text-secondary);margin:0 0 20px;text-align:center;}
  label{font-size:13px;color:var(--text-secondary);display:block;margin-bottom:5px;}
  input[type=email],input[type=password]{width:100%;padding:10px 11px;border:1px solid var(--border-strong);border-radius:8px;font-size:16px;background:var(--surface);color:var(--text-primary);font-family:inherit;}
  .field{margin-bottom:14px;}
  button{width:100%;padding:12px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin-top:8px;}
  button.primary{background:var(--accent);color:#fff;}
  button.ghost{background:none;border:1px solid var(--border-strong);color:var(--text-primary);}
  button:disabled{opacity:0.6;cursor:default;}
  .status{font-size:13px;margin-top:14px;text-align:center;min-height:16px;}
  .divider{border-top:1px solid var(--border);margin:18px 0;}
  .branch-list{margin-top:10px;}
  .branch-btn{display:block;width:100%;padding:10px;margin-top:8px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);text-align:left;font-size:14px;cursor:pointer;color:var(--text-primary);}
</style>
</head>
<body>
<div class="card">
  <h1>タクマ塾 管理システム</h1>
  <p class="sub">メールアドレスとパスワードでログインしてください。権限に応じた画面に自動で移動します。<br>※新しいアカウントはここでは作れません。管理者から発行してもらってください。</p>

  <div class="field"><label for="email">メールアドレス</label><input type="email" id="email" autocomplete="username"></div>
  <div class="field"><label for="password">パスワード</label><input type="password" id="password" autocomplete="current-password"></div>

  <button class="primary" id="btn-login">ログイン</button>

  <p class="status" id="status"></p>
  <div class="branch-list" id="branch-list"></div>

  <div class="divider"></div>
  <div style="padding:12px 14px;border:1px solid var(--border-strong);border-radius:8px;background:var(--bg);">
    <p style="font-weight:700;font-size:13px;margin:0 0 4px;">まだアカウントをお持ちでない方へ</p>
    <p class="status" style="margin:0;color:var(--text-muted);">このシステムは、ご自身で新規登録することはできません。所属する校の管理者、または本部にご連絡いただき、アカウントを発行してもらってください。</p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDKTuN49WGP1pFobS6rS_RwDnDvzJe1h00",
  authDomain: "takuma-juku-iwakuni.firebaseapp.com",
  projectId: "takuma-juku-iwakuni",
  storageBucket: "takuma-juku-iwakuni.firebasestorage.app",
  messagingSenderId: "1065956673618",
  appId: "1:1065956673618:web:e765409502a9b87031b78b"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

function escAttr(v){ return String(v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function basePath(){ return window.location.origin + window.location.pathname.replace(/index\.html$/, ''); }

// 権限を調べて、行き先を自動で決める。利用者はどのボタンかを選ぶ必要がない。
async function fetchSchoolNames(){
  try {
    const snap = await db.collection('schools').get();
    const map = {};
    snap.docs.forEach(d => { map[d.id] = d.data().name || d.id; });
    return map;
  } catch(e){ console.error('schools load failed', e); return {}; }
}

function goHQ(){ window.location.href = basePath() + 'hq.html'; }
function goSchool(id){ window.location.href = basePath() + 'school.html?school=' + encodeURIComponent(id); }

// 行き先が複数ある人(本部権限と所属校を併せ持つ、または複数校の担当)には選んでもらう
function showDestinations(isHQ, schoolIds, names){
  const listEl = document.getElementById('branch-list');
  const parts = [];
  if (isHQ) parts.push('<button type="button" class="branch-btn" data-hq="1">管理者ページ(全校舎)</button>');
  schoolIds.forEach(id => {
    parts.push('<button type="button" class="branch-btn" data-id="' + escAttr(id) + '">' + escAttr(names[id] || id) + '</button>');
  });
  listEl.innerHTML = parts.join('');
  listEl.querySelectorAll('.branch-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.hq) goHQ(); else goSchool(btn.dataset.id);
    });
  });
}

async function doLogin(){
  const statusEl = document.getElementById('status');
  const branchListEl = document.getElementById('branch-list');
  const btn = document.getElementById('btn-login');
  branchListEl.innerHTML = '';
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  if (!email || !password){ statusEl.style.color = 'var(--danger)'; statusEl.textContent = 'メールアドレスとパスワードを入力してください。'; return; }
  statusEl.style.color = 'var(--text-secondary)';
  statusEl.textContent = 'ログインしています…';
  btn.disabled = true;
  try {
    const cred = await auth.signInWithEmailAndPassword(email, password);
    const uid = cred.user.uid;
    statusEl.textContent = '権限を確認しています…';

    // 本部権限(システム管理者・運用管理者)の確認。片方の失敗が全体を止めないよう個別に読む
    let isHQ = false;
    try { isHQ = (await db.collection('systemAdmins').doc(uid).get()).exists; } catch(e){ console.error('systemAdmins check failed', e); }
    if (!isHQ){
      try { isHQ = (await db.collection('hqAdmins').doc(uid).get()).exists; } catch(e){ console.error('hqAdmins check failed', e); }
    }

    // 所属校の確認
    let schoolIds = [];
    let staffLookupFailed = false;
    try {
      const snap = await db.collectionGroup('staff').where('uid', '==', uid).get();
      schoolIds = snap.docs.map(d => d.ref.parent.parent.id);
    } catch(qe){
      console.error('staff lookup failed', qe);
      staffLookupFailed = true;
    }

    if (!isHQ && schoolIds.length === 0){
      statusEl.style.color = 'var(--danger)';
      statusEl.textContent = staffLookupFailed
        ? '所属校の確認に失敗しました。時間をおいて再度お試しいただくか、管理者にご連絡ください。'
        : 'このアカウントには権限が設定されていません。管理者にアカウントの設定をご依頼ください。';
      return;
    }

    // 行き先が1つに定まる場合はそのまま移動する
    if (isHQ && schoolIds.length === 0){
      statusEl.style.color = 'var(--accent-dark)';
      statusEl.textContent = '✓ 管理者ページに移動します…';
      goHQ();
      return;
    }
    if (!isHQ && schoolIds.length === 1){
      statusEl.style.color = 'var(--accent-dark)';
      statusEl.textContent = '✓ ログインしました。移動します…';
      goSchool(schoolIds[0]);
      return;
    }

    const names = await fetchSchoolNames();
    statusEl.style.color = 'var(--text-secondary)';
    statusEl.textContent = '移動先を選んでください。';
    showDestinations(isHQ, schoolIds, names);
  } catch(e){
    console.error(e);
    statusEl.style.color = 'var(--danger)';
    statusEl.textContent = e && (e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found')
      ? 'メールアドレスまたはパスワードが正しくありません。'
      : 'ログインに失敗しました: ' + e.message;
  } finally {
    btn.disabled = false;
  }
}

document.getElementById('btn-login').addEventListener('click', doLogin);
document.getElementById('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
document.getElementById('email').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
