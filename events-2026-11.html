<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>タクマ塾 11月イベントのご案内</title>
<style>
:root{color-scheme:light;--blue:#111;--navy:#000;--garnet:#111;--gold:#d4d4d4;--bg:#f2f2f2;--card:#fff;--text:#111;--sub:#6b6b6b;--line:#e2e2e2;--tint:#f4f4f4}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","Noto Sans JP",sans-serif;font-size:16px;line-height:1.7;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
.wrap{padding:0}
header{position:relative;background:linear-gradient(160deg,#2b2b2b 0%,#000 100%);color:#fff;padding:36px max(20px,env(safe-area-inset-right)) 64px max(20px,env(safe-area-inset-left));clip-path:polygon(0 0,100% 0,100% calc(100% - 22px),0 100%)}
header>*{max-width:640px;margin-left:auto;margin-right:auto}
header::before{content:"タクマ塾岩国校";display:block;max-width:640px;margin:0 auto 18px;color:var(--gold);font-size:13px;font-weight:800;letter-spacing:.14em}
h1{font-size:clamp(24px,6.8vw,38px);font-weight:900;letter-spacing:-.01em;line-height:1.25;margin-top:0;margin-bottom:0;text-wrap:balance}
.sub,header p{margin-top:12px;margin-bottom:0;color:var(--gold);font-size:16px;font-weight:800;letter-spacing:.04em}
.stripe{height:6px;background:repeating-linear-gradient(90deg,#111 0 28px,#a3a3a3 28px 56px)}
.card,footer{max-width:640px}
.card{background:var(--card);margin:16px max(16px,env(safe-area-inset-left));border-radius:16px;padding:24px 20px;box-shadow:0 2px 12px rgba(0,0,0,.08);border-top:4px solid var(--blue)}
@media (min-width:700px){.card{margin-left:auto;margin-right:auto}}
header+.card,.stripe+.card{margin-top:-18px;position:relative}
.card h2{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:900;color:var(--blue);line-height:1.3;margin:0 0 16px}
.card h2::before{content:"";flex:none;width:6px;height:1.1em;background:var(--garnet);border-radius:3px}
.card p{margin:0 0 8px}
a{color:var(--blue);text-decoration:underline;text-underline-offset:3px;font-weight:700}
table{width:100%;border-collapse:collapse}
th,td{padding:13px 0;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{width:6.4em;color:var(--blue);font-size:13px;font-weight:800;padding-right:12px}
tr:last-child th,tr:last-child td{border-bottom:none}
td.r{text-align:right;white-space:nowrap}
tr.total td{font-weight:800;font-size:15px}
tr.total td.r{color:var(--blue);font-size:34px;font-weight:900;letter-spacing:-.02em;line-height:1.1}
.toc{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.toc a{display:flex;align-items:center;gap:12px;min-height:60px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--tint);color:var(--text);text-decoration:none;font-weight:800;font-size:16px}
.toc .n{color:var(--garnet);font-weight:900;min-width:1.6em}
.toc .t{flex:1}
.toc .go{display:none}
.toc a::after{content:"›";flex:none;width:30px;height:30px;border-radius:50%;background:var(--garnet);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1;padding-bottom:3px}
.day{display:block;margin:26px 0 10px;padding:8px 12px;border-radius:8px;background:var(--blue);color:#fff;font-size:14px;font-weight:800;letter-spacing:.02em}
.card h2+.day,.card .day:first-child{margin-top:0}
ul.plain{margin:10px 0;padding-left:1.2em}
ul.plain li{padding:3px 0}
ul.plain li::marker{color:var(--garnet)}
.leg{border-left:3px solid var(--garnet);padding:2px 0 2px 14px;margin:14px 0}
.leg .tm{font-weight:800}
.leg .tr{color:var(--sub);font-size:14px}
.meta,.note,.warn{color:var(--sub);font-size:14px;margin:10px 0 0}
.pending{color:var(--sub);font-size:14px}
.callout{background:var(--tint);border-left:4px solid var(--blue);border-radius:8px;padding:14px 16px;margin:0 0 8px;font-size:15px}
.urgent{background:var(--garnet);color:#fff;border-radius:10px;padding:14px 16px;font-weight:800;margin-bottom:18px}
.btn{display:flex;align-items:center;justify-content:center;min-height:54px;margin-top:16px;padding:0 24px;border-radius:999px;background:var(--garnet);color:#fff;font-weight:800;font-size:16px;text-decoration:none;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.btn+.note{margin-top:18px}
.top{display:inline-flex;align-items:center;min-height:48px;margin-top:12px;color:var(--blue);font-size:14px;text-decoration:none}
.poster{padding:12px}
.poster img{display:block;width:100%;height:auto;border-radius:10px}
.poster .note{text-align:center;margin:10px 0 2px}
footer{margin:32px 0 0;max-width:none;background:var(--navy);color:#fff;text-align:center;padding:28px 20px calc(28px + env(safe-area-inset-bottom));font-size:14px;font-weight:800;letter-spacing:.08em}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>11月のイベントのご案内</h1>
  <p class="sub">タクマ塾 保護者の皆さまへ</p>
</header>
<div class="stripe"></div>

<div class="card">
  <h2>ご案内一覧</h2>
  <ul class="toc">
    <li><a href="fukui-trip.html"><span class="t">福井遠征(11/28〜29)</span><span class="go">開く ▶</span></a></li>
    <li><a href="deliatail-invite.html"><span class="t">デリアテール杯 招待枠確認(11/28)</span><span class="go">開く ▶</span></a></li>
    <li><a href="deliatail-uniform.html"><span class="t">デリアテール杯 サイン入りユニフォーム申込</span><span class="go">開く ▶</span></a></li>
  </ul>
</div>

<footer>タクマ塾岩国校</footer>
</div>
</body>
</html>
