<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>タクマ塾 11月イベントのご案内</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1f2933;--sub:#5f6c7b;--line:#e3e7ec;--accent:#0b6e4f;--accent-bg:#e7f4ee;--warn:#b42318;--warn-bg:#fdecea}
@media (prefers-color-scheme:dark){:root{--bg:#14181c;--card:#1d2328;--text:#e8ecef;--sub:#9aa7b3;--line:#2c353d;--accent:#5fd0a5;--accent-bg:#1c332b;--warn:#ff9b8f;--warn-bg:#3a1f1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.75;font-size:16px}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 56px}
h1{font-size:20px;margin:0 0 4px}
.sub{margin:0;color:var(--sub);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:16px}
.card h2{font-size:17px;margin:0 0 10px}
.urgent{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:12px;font-weight:700}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{width:7.5em;color:var(--sub);font-weight:600;font-size:14px}
tr:last-child th,tr:last-child td{border-bottom:none}
.btn{display:block;text-align:center;margin-top:14px;padding:14px;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;text-decoration:none}
@media (prefers-color-scheme:dark){.btn{color:#0b1f17}}
.note{color:var(--sub);font-size:13px;margin-top:12px}
.toc{list-style:none;margin:0;padding:0}.toc li+li{margin-top:8px}
.toc a{display:flex;gap:10px;align-items:center;padding:14px 12px;border-radius:10px;background:var(--accent-bg);color:var(--text);text-decoration:none}
.toc .t{flex:1;font-weight:600}.toc .go{color:var(--accent);font-size:13px;white-space:nowrap}
footer{margin-top:28px;text-align:center;color:var(--sub);font-size:13px}
/* mobile */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent}
.wrap{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-bottom:calc(88px + env(safe-area-inset-bottom))}
.toc a,.btn,.top{min-height:48px}
.top{display:inline-flex;align-items:center;padding:0 4px}
.fab{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));z-index:10;display:flex;align-items:center;min-height:48px;padding:0 18px;border-radius:24px;background:var(--accent);color:#fff;font-weight:700;font-size:14px;text-decoration:none;box-shadow:0 2px 10px rgba(0,0,0,.25)}
@media (prefers-color-scheme:dark){.fab{color:#0b1f17}}
@media (max-width:480px){
  .card{padding:14px}
  h1{font-size:19px}
  .toc .go{display:none}
  .toc a::after{content:"▶";color:var(--accent);font-size:13px}
  th,td{padding:10px 4px}
  .day{font-size:14px}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>11月のイベントのご案内</h1>
  <p class="sub">タクマ塾 保護者の皆さまへ</p>
</header>

<div class="card">
  <h2>ご案内一覧</h2>
  <ul class="toc">
    <li><a href="fukui-trip.html"><span class="t">福井遠征(11/28〜29)</span><span class="go">開く ▶</span></a></li>
    <li><a href="deliatail-invite.html"><span class="t">デリアテール杯 招待枠確認(11/28)</span><span class="go">開く ▶</span></a></li>
    <li><a href="deliatail-uniform.html"><span class="t">デリアテール杯 サイン入りユニフォーム申込</span><span class="go">開く ▶</span></a></li>
  </ul>
</div>

<footer>タクマ塾 運営事務局</footer>
</div>
</body>
</html>
