<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タクマ塾 保護者ページ</title>
<style>
  :root{
    --bg:#F6F6F1; --surface:#FFFFFF; --border:#E1E7E7; --border-strong:#C7D2D2;
    --text-primary:#12181A; --text-secondary:#5B6668; --text-muted:#8A9799;
    --accent:#0FB8C4; --accent-dark:#0A8A93; --accent-bg:#E3F7F8;
    --danger:#D6483F; --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Hiragino Sans","Yu Gothic",-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text-primary);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:26px 22px;max-width:420px;width:100%;}
  h1{font-size:19px;margin:0 0 4px;text-align:center;}
  p.sub{font-size:13px;color:var(--text-secondary);margin:0 0 20px;text-align:center;}
  label{font-size:13px;color:var(--text-secondary);display:block;margin-bottom:5px;}
  select{width:100%;padding:11px;border:1px solid var(--border-strong);border-radius:8px;font-size:16px;background:var(--surface);color:var(--text-primary);font-family:inherit;font-weight:600;}
  .field{margin-bottom:18px;}
  a.menu-btn{display:block;border:1px solid var(--border-strong);border-radius:12px;padding:16px 18px;margin-bottom:12px;text-decoration:none;color:var(--text-primary);background:var(--surface);transition:border-color 0.15s;}
  a.menu-btn:active{border-color:var(--accent);background:var(--accent-bg);}
  a.menu-btn .mb-title{font-weight:700;font-size:15px;margin-bottom:2px;}
  a.menu-btn .mb-desc{font-size:12px;color:var(--text-secondary);}
  .note{font-size:12px;color:var(--text-muted);text-align:center;margin:16px 0 0;}
</style>
</head>
<body>
<div class="card" id="gate-card" style="display:none;">
  <h1>タクマ塾 保護者ページ</h1>
  <p class="sub">このページは塾生のご家族専用です。<br>確認のため、お子さまの情報を入力してください(この端末で初回のみ)。</p>
  <div id="gate-form">
    <div class="field"><label for="gate-school">お子さまの校舎</label><select id="gate-school"><option value="">読み込み中…</option></select></div>
    <div class="field"><label for="gate-name">塾生のお名前(姓名)</label><input type="text" id="gate-name" placeholder="例: 山田 蓮"></div>
    <button type="button" class="menu-btn" id="gate-submit" style="text-align:center;background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;cursor:pointer;width:100%;font-size:15px;font-family:inherit;">利用を開始する</button>
    <p class="note" id="gate-status" style="min-height:16px;"></p>
  </div>
  <div id="gate-pending" style="display:none;text-align:center;padding:10px 0;">
    <p style="font-weight:700;font-size:14px;margin:0 0 6px;">申請を受け付けました</p>
    <p class="note" style="margin:0;">入力されたお名前が名簿と一致しなかったため、教室の確認をお待ちください。<br>確認が済むと、このページが自動で切り替わります。</p>
  
    <button type="button" id="gate-retry" style="margin-top:12px;background:none;border:1px solid var(--border-strong);border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer;font-family:inherit;color:var(--text-primary);">お名前を入力し直す</button>
  </div>
</div>

<div class="card" id="menu-card" style="display:none;">
  <h1>タクマ塾 保護者ページ</h1>
  <p class="sub">ログインは不要です。ご用件をお選びください。</p>

  <div class="field">
    <label for="menu-school">お子さまの校舎</label>
    <select id="menu-school"><option value="">読み込み中…</option></select>
  </div>

  <a class="menu-btn" href="absence-form.html">
    <div class="mb-title">🙋 欠席のご連絡</div>
    <div class="mb-desc">練習をお休みする時は、こちらからご連絡ください。</div>
  </a>
  <a class="menu-btn" href="calendar-view.html">
    <div class="mb-title">📅 活動予定</div>
    <div class="mb-desc">練習・試合・イベントの予定(今日から60日分)をご覧いただけます。</div>
  </a>

  <p class="note">校舎を選んでおくと、各ページに選択済みの状態で移動します。</p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDKTuN49WGP1pFobS6rS_RwDnDvzJe1h00",
  authDomain: "takuma-juku-iwakuni.firebaseapp.com",
  projectId: "takuma-juku-iwakuni",
  storageBucket: "takuma-juku-iwakuni.firebasestorage.app",
  messagingSenderId: "1065956673618",
  appId: "1:1065956673618:web:e765409502a9b87031b78b"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// ---- 塾生名簿との照合による関門(塾生家庭以外の閲覧を防ぐ) ----
function normalizeName(n){ return String(n || '').replace(/[\s　]/g, ''); }
async function ensureAnon(){
  if (auth.currentUser) return auth.currentUser;
  const cred = await auth.signInAnonymously();
  return cred.user;
}
function showMenu(){
  document.getElementById('gate-card').style.display = 'none';
  document.getElementById('menu-card').style.display = 'block';
}
function showPending(uid){
  document.getElementById('gate-card').style.display = 'block';
  document.getElementById('gate-form').style.display = 'none';
  document.getElementById('gate-pending').style.display = 'block';
  // 承認されたら自動でメニューに切り替える
  db.collection('parentViewers').doc(uid).onSnapshot(doc => {
    if (doc.exists && doc.data().status === 'approved') showMenu();
  }, err => console.error(err));
}
// 承認待ちの間も、名前を入力し直して再申請できる(誤字で待ち続けるのを防ぐ)
document.getElementById('gate-retry').addEventListener('click', () => {
  document.getElementById('gate-pending').style.display = 'none';
  document.getElementById('gate-form').style.display = 'block';
  const st = document.getElementById('gate-status');
  if (st) st.textContent = '';
  loadGateSchoolOptions();
});

async function loadGateSchoolOptions(){
  const sel = document.getElementById('gate-school');
  try {
    const snap = await db.collection('schools').orderBy('name').get();
    sel.innerHTML = '<option value="">選択してください</option>' + snap.docs.map(d => `<option value="${d.id}">${escAttr(d.data().name || d.id)}</option>`).join('');
    let remembered = null;
    try { remembered = localStorage.getItem(LAST_SCHOOL_KEY); } catch(e){}
    if (remembered && snap.docs.some(d => d.id === remembered)) sel.value = remembered;
  } catch(e){ console.error(e); sel.innerHTML = '<option value="">読み込みに失敗しました</option>'; }
}
async function initGate(){
  try {
    const user = await ensureAnon();
    const doc = await db.collection('parentViewers').doc(user.uid).get();
    if (doc.exists){
      if (doc.data().status === 'approved'){ showMenu(); return; }
      showPending(user.uid);
      return;
    }
  } catch(e){ console.error(e); }
  document.getElementById('gate-card').style.display = 'block';
  loadGateSchoolOptions();
}
document.getElementById('gate-submit').addEventListener('click', async () => {
  const statusEl = document.getElementById('gate-status');
  const schoolId = document.getElementById('gate-school').value;
  const name = document.getElementById('gate-name').value.trim();
  if (!schoolId){ statusEl.style.color = 'var(--danger)'; statusEl.textContent = '校舎を選択してください。'; return; }
  if (!name){ statusEl.style.color = 'var(--danger)'; statusEl.textContent = '塾生のお名前を入力してください。'; return; }
  statusEl.style.color = 'var(--text-secondary)';
  statusEl.textContent = '確認しています…';
  const user = await ensureAnon();
  try { localStorage.setItem(LAST_SCHOOL_KEY, schoolId); } catch(e){}
  const base = { studentName: name, nameKey: normalizeName(name), schoolId, createdAt: firebase.firestore.FieldValue.serverTimestamp() };
  try {
    // まず名簿との照合(一致すれば即「承認済み」で登録できる)
    await db.collection('parentViewers').doc(user.uid).set(Object.assign({ status: 'approved' }, base));
    showMenu();
  } catch(e1){
    try {
      // 一致しない場合は「承認待ち」として申請する
      await db.collection('parentViewers').doc(user.uid).set(Object.assign({ status: 'pending' }, base));
      showPending(user.uid);
    } catch(e2){
      console.error(e2);
      statusEl.style.color = 'var(--danger)';
      statusEl.textContent = '確認に失敗しました。通信環境をご確認のうえ、もう一度お試しください。';
    }
  }
});
initGate();

function escAttr(v){ return String(v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// 欠席フォーム・予定ページと同じ記憶キーを共用する。ここで選べば各ページに引き継がれる
const LAST_SCHOOL_KEY = 'takumajuku_last_school';

async function loadSchoolOptions(){
  const sel = document.getElementById('menu-school');
  try {
    const snap = await db.collection('schools').orderBy('name').get();
    if (snap.empty){
      sel.innerHTML = '<option value="">校舎が登録されていません</option>';
      return;
    }
    sel.innerHTML = '<option value="">選択してください</option>' + snap.docs.map(d => `<option value="${d.id}">${escAttr(d.data().name || d.id)}</option>`).join('');
    let remembered = null;
    try { remembered = localStorage.getItem(LAST_SCHOOL_KEY); } catch(e){}
    if (remembered && snap.docs.some(d => d.id === remembered)) sel.value = remembered;
  } catch(e){
    console.error(e);
    sel.innerHTML = '<option value="">読み込みに失敗しました</option>';
  }
}
loadSchoolOptions();

document.getElementById('menu-school').addEventListener('change', (e) => {
  try {
    if (e.target.value) localStorage.setItem(LAST_SCHOOL_KEY, e.target.value);
  } catch(err){}
});
</script>
</body>
</html>
