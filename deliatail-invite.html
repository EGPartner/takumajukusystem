<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>デリアテール杯 招待枠確認</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1f2933;--sub:#5f6c7b;--line:#e3e7ec;--accent:#0b6e4f;--accent-bg:#e7f4ee;--warn:#b42318;--warn-bg:#fdecea}
@media (prefers-color-scheme:dark){:root{--bg:#14181c;--card:#1d2328;--text:#e8ecef;--sub:#9aa7b3;--line:#2c353d;--accent:#5fd0a5;--accent-bg:#1c332b;--warn:#ff9b8f;--warn-bg:#3a1f1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.75;font-size:16px}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 56px}
h1{font-size:20px;margin:0 0 4px}
.sub{margin:0;color:var(--sub);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:16px}
.card h2{font-size:17px;margin:0 0 10px}
.urgent{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:12px;font-weight:700}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{width:7.5em;color:var(--sub);font-weight:600;font-size:14px}
tr:last-child th,tr:last-child td{border-bottom:none}
.btn{display:block;text-align:center;margin-top:14px;padding:14px;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;text-decoration:none}
@media (prefers-color-scheme:dark){.btn{color:#0b1f17}}
.note{color:var(--sub);font-size:13px;margin-top:12px}
footer{margin-top:28px;text-align:center;color:var(--sub);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>デリアテール杯2026<br>招待枠確認のお知らせ</h1>
  <p class="sub">11月28日(土)開催</p>
</header>

<div class="card">
  <div class="urgent">回答期限：11月6日(金)まで(必ずお願いします)</div>
  <p>11月28日(土)に行われる、毎年恒例のデリアテール杯に、<b>タクマ塾会員様(ご家族を含む)を無料でご招待</b>します。</p>
  <p style="margin:0">つきましては、11月28日(土)当日に観戦される人数を教えてください。</p>
</div>

<div class="card">
  <h2>お知らせいただく内容</h2>
  <table>
    <tr><th>① お子様</th><td>会員のお子様のお名前</td></tr>
    <tr><th>② 人数</th><td>ご家族が何名か<br>(例)保護者2名・兄弟1名</td></tr>
    <tr><th>回答期限</th><td>11月6日(金)まで</td></tr>
  </table>
</div>

<div class="card">
  <h2>お返事の方法</h2>
  <p class="note" style="margin:0">準備中</p>
</div>

<footer>タクマ塾 運営事務局</footer>
</div>
</body>
</html>
