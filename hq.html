<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>タクマ塾 本部管理</title>
<style>
  :root{
    --bg:#F6F6F1; --surface:#FFFFFF; --border:#E1E7E7; --border-strong:#C7D2D2;
    --text-primary:#12181A; --text-secondary:#5B6668; --text-muted:#8A9799;
    --accent:#0FB8C4; --accent-dark:#0A8A93; --accent-bg:#E3F7F8;
    --danger:#D6483F; --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Hiragino Sans","Yu Gothic",-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text-primary);line-height:1.6;}
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 60px;}
  header{margin-bottom:18px;}
  header h1{font-size:19px;font-weight:700;margin:0 0 4px;}
  header p{font-size:13px;color:var(--text-secondary);margin:0;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px;}
  .field{margin-bottom:14px;}
  label{font-size:13px;color:var(--text-secondary);display:block;margin-bottom:5px;}
  input[type=text],input[type=email],input[type=password]{width:100%;padding:10px 11px;border:1px solid var(--border-strong);border-radius:8px;font-size:16px;background:var(--surface);color:var(--text-primary);font-family:inherit;}
  button{padding:10px 16px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;}
  button.primary{background:var(--accent);color:#fff;}
  button.ghost{background:none;border:1px solid var(--border-strong);color:var(--text-primary);}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
  .status{font-size:13px;margin-top:10px;min-height:16px;}
  .school-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);gap:10px;}
  .school-row:last-child{border-bottom:none;}
  .school-name{font-weight:700;font-size:14px;}
  .school-meta{font-size:12px;color:var(--text-secondary);}
  .empty{color:var(--text-muted);font-size:13px;text-align:center;padding:20px 0;}
  a.link-btn{font-size:13px;color:var(--accent-dark);text-decoration:none;border:1px solid var(--border-strong);padding:7px 12px;border-radius:8px;white-space:nowrap;}
  .absence-row{padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .absence-row:last-child{border-bottom:none;}
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--accent-bg);color:var(--accent-dark);font-weight:600;}
  .badge.muted{background:#F0EFE9;color:var(--text-muted);}
  .field{margin-bottom:14px;}
  select, input[type=date], input[type=time], textarea{width:100%;padding:10px 11px;border:1px solid var(--border-strong);border-radius:8px;font-size:16px;background:var(--surface);color:var(--text-primary);font-family:inherit;}
  .row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;}
  .cal-row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .cal-row:last-child{border-bottom:none;}
  .cal-row.cancelled{opacity:0.5;}
  .cal-row .cr-date{width:56px;flex:0 0 56px;font-weight:700;}
  .cal-row .cr-time{width:88px;flex:0 0 88px;color:var(--text-secondary);}
  .cal-row .cr-body{flex:1 1 auto;}
  .cal-row .cr-school{font-weight:700;color:var(--accent-dark);}
  .cal-row .cr-loc, .cal-row .cr-staff{color:var(--text-secondary);font-size:12px;}
  .cal-row .cr-actions{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;}
  .checkbox-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
  .checkbox-row input{width:auto;}
  .mini-table{width:100%;border-collapse:collapse;font-size:12px;}
  .mini-table th,.mini-table td{padding:6px 5px;text-align:left;border-bottom:1px solid var(--border);}
  .link-danger{background:none;border:none;color:var(--danger);font-size:12px;cursor:pointer;width:auto;padding:2px 4px;}
  .ghost-small{padding:6px 10px;font-size:12px;width:auto;background:none;border:1px solid var(--border-strong);border-radius:6px;color:var(--text-primary);cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>タクマ塾 本部管理</h1>
    <p>全校舎の一覧・新規登録(本部管理者専用)</p>
  </header>

  <div class="card" id="login-card">
    <div class="field"><label for="email">メールアドレス</label><input type="email" id="email"></div>
    <div class="field"><label for="password">パスワード</label><input type="password" id="password"></div>
    <div class="btn-row"><button class="primary" id="btn-login">ログイン</button></div>
    <p class="status" id="login-status"></p>
  </div>

  <div id="main-content" style="display:none;">
    <div class="card">
      <div class="btn-row" style="justify-content:space-between;">
        <span id="who"></span>
        <button class="ghost" id="btn-logout">ログアウト</button>
      </div>
    </div>

    <div class="card">
      <h2 style="font-size:15px;margin:0 0 4px;">統合スケジュール(全校舎)</h2>
      <p class="status" style="margin-top:0;color:var(--text-muted);">今日から60日間の予定を、校舎をまたいでまとめて確認・編集できます。校舎ごとのページを行き来する必要はありません。</p>
      <div id="hq-calendar-list"><div class="empty">読み込み中…</div></div>
    </div>

    <div class="card">
      <h2 style="font-size:15px;margin:0 0 4px;">この日だけの予定を編集</h2>
      <p class="status" id="hq-occ-hint" style="margin-top:0;color:var(--text-muted);">上の一覧から「編集」を押すと、ここに内容が表示されます。</p>
      <div id="hq-occ-editor" style="display:none;">
        <div class="row2">
          <div class="field"><label>校舎</label><input type="text" id="hq-occ-school" disabled></div>
          <div class="field"><label>日付</label><input type="text" id="hq-occ-date" disabled></div>
        </div>
        <div class="row2">
          <div class="field"><label>種別</label>
            <select id="hq-occ-type"><option value="通常練習">通常練習</option><option value="試合">試合</option><option value="イベント">イベント</option></select>
          </div>
          <div class="field"><label>場所</label><select id="hq-occ-location"></select></div>
        </div>
        <div class="row2">
          <div class="field"><label>開始時刻</label><input type="time" id="hq-occ-start"></div>
          <div class="field"><label>終了時刻</label><input type="time" id="hq-occ-end"></div>
        </div>
        <div class="field"><label>担当スタッフ</label><input type="text" id="hq-occ-staff"></div>
        <div class="field"><label>対象学年/グループ</label><input type="text" id="hq-occ-target"></div>
        <div class="field"><label>備考</label><textarea id="hq-occ-note" rows="2"></textarea></div>
        <div class="checkbox-row"><input type="checkbox" id="hq-occ-cancelled"><label for="hq-occ-cancelled">この日は中止にする</label></div>
        <div class="btn-row">
          <button class="primary" id="hq-btn-save-occ" style="width:auto;">保存</button>
          <button class="ghost-small" id="hq-btn-reset-occ" style="display:none;">上書きを解除</button>
          <button class="link-danger" id="hq-btn-delete-occ" style="display:none;">この単発予定を削除</button>
        </div>
        <p class="status" id="hq-occ-status"></p>
      </div>
    </div>

    <div class="card">
      <h2 style="font-size:15px;margin:0 0 4px;">単発予定を追加</h2>
      <div class="row2">
        <div class="field"><label>校舎</label><select id="hq-new-occ-school"></select></div>
        <div class="field"><label>日付</label><input type="date" id="hq-new-occ-date"></div>
      </div>
      <div class="row2">
        <div class="field"><label>種別</label>
          <select id="hq-new-occ-type"><option value="試合">試合</option><option value="イベント">イベント</option><option value="通常練習">通常練習</option></select>
        </div>
        <div class="field"><label>場所</label><select id="hq-new-occ-location"></select></div>
      </div>
      <div class="row2">
        <div class="field"><label>開始時刻</label><input type="time" id="hq-new-occ-start"></div>
        <div class="field"><label>終了時刻</label><input type="time" id="hq-new-occ-end"></div>
      </div>
      <div class="field"><label>担当スタッフ</label><input type="text" id="hq-new-occ-staff"></div>
      <div class="field"><label>対象学年/グループ</label><input type="text" id="hq-new-occ-target"></div>
      <div class="field"><label>備考</label><textarea id="hq-new-occ-note" rows="2"></textarea></div>
      <div class="btn-row"><button class="primary" id="hq-btn-add-occ" style="width:auto;">追加する</button></div>
      <p class="status" id="hq-add-occ-status"></p>
    </div>

    <div class="card">
      <h2 style="font-size:15px;margin:0 0 12px;">全校舎の欠席連絡</h2>
      <div id="absence-list"><div class="empty">読み込み中…</div></div>
    </div>

    <details class="card" style="padding:0;">
      <summary style="cursor:pointer;padding:18px;font-size:15px;font-weight:700;">その他の管理(校舎一覧・定期パターン・新規登録)</summary>
      <div style="padding:0 18px 18px;">

        <h2 style="font-size:14px;margin:18px 0 12px;">校舎一覧</h2>
        <div id="school-list"><div class="empty">読み込み中…</div></div>

        <h2 style="font-size:14px;margin:24px 0 4px;">定期パターン一覧(全校舎)</h2>
        <div style="overflow-x:auto;">
          <table class="mini-table">
            <thead><tr><th>校舎</th><th>曜日</th><th>時間</th><th>種別</th><th></th></tr></thead>
            <tbody id="hq-patterns-tbody"></tbody>
          </table>
        </div>
        <div class="row2" style="margin-top:12px;">
          <div class="field"><label>新規パターンを追加する校舎</label><select id="hq-new-pattern-school"></select></div>
          <div class="field"><label>曜日</label>
            <select id="hq-new-pattern-weekday"><option value="0">日曜</option><option value="1">月曜</option><option value="2" selected>火曜</option><option value="3">水曜</option><option value="4">木曜</option><option value="5">金曜</option><option value="6">土曜</option></select>
          </div>
        </div>
        <div class="btn-row"><button class="primary" id="hq-btn-add-pattern" style="width:auto;">+ このパターンを追加</button></div>
        <p class="status" id="hq-add-pattern-status"></p>

        <h2 style="font-size:14px;margin:24px 0 4px;">新しい校舎を追加</h2>
        <p class="status" style="margin-top:0;color:var(--text-muted);">校舎IDは半角英数字とハイフンのみ(例: nara)。あとで変更できません。</p>
        <div class="field"><label for="new-name">校舎名</label><input type="text" id="new-name" placeholder="例: タクマ塾奈良校"></div>
        <div class="field"><label for="new-id">校舎ID</label><input type="text" id="new-id" placeholder="例: nara"></div>
        <div class="btn-row"><button class="primary" id="btn-add-school">追加する</button></div>
        <p class="status" id="add-status"></p>

      </div>
    </details>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDKTuN49WGP1pFobS6rS_RwDnDvzJe1h00",
  authDomain: "takuma-juku-iwakuni.firebaseapp.com",
  projectId: "takuma-juku-iwakuni",
  storageBucket: "takuma-juku-iwakuni.firebasestorage.app",
  messagingSenderId: "1065956673618",
  appId: "1:1065956673618:web:e765409502a9b87031b78b"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const schoolsRef = db.collection('schools');
const hqAdminsRef = db.collection('hqAdmins');

let currentUser = null;
let schoolsMap = {};

function pad(n){ return String(n).padStart(2,'0'); }
function currentMonthKey(){ const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth()+1); }
function escAttr(v){ return String(v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

document.getElementById('btn-login').addEventListener('click', async () => {
  const statusEl = document.getElementById('login-status');
  statusEl.style.color = 'var(--text-secondary)';
  statusEl.textContent = 'ログインしています…';
  try {
    await auth.signInWithEmailAndPassword(document.getElementById('email').value.trim(), document.getElementById('password').value);
  } catch(e){
    statusEl.style.color = 'var(--danger)';
    statusEl.textContent = 'ログインに失敗しました: ' + e.message;
  }
});
document.getElementById('btn-logout').addEventListener('click', () => auth.signOut());

document.getElementById('btn-add-school').addEventListener('click', async () => {
  const statusEl = document.getElementById('add-status');
  const name = document.getElementById('new-name').value.trim();
  const id = document.getElementById('new-id').value.trim();
  if (!name || !id){ statusEl.style.color = 'var(--danger)'; statusEl.textContent = '校舎名と校舎IDの両方を入力してください。'; return; }
  if (!/^[a-z0-9-]+$/.test(id)){ statusEl.style.color = 'var(--danger)'; statusEl.textContent = '校舎IDは半角英数字とハイフンのみで入力してください。'; return; }
  statusEl.style.color = 'var(--text-secondary)';
  statusEl.textContent = '登録しています…';
  try {
    const existing = await schoolsRef.doc(id).get();
    if (existing.exists){ statusEl.style.color = 'var(--danger)'; statusEl.textContent = 'この校舎IDはすでに使われています。'; return; }
    await schoolsRef.doc(id).set({ name, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    await db.collection('academies').doc(id).collection('staff').doc(currentUser.uid).set({ role:'admin', email: currentUser.email, uid: currentUser.uid });
    statusEl.style.color = 'var(--accent-dark)';
    statusEl.textContent = '✓ 登録しました。ご自身がこの校舎の管理者として設定されています。';
    document.getElementById('new-name').value = '';
    document.getElementById('new-id').value = '';
    loadSchools();
  } catch(e){
    statusEl.style.color = 'var(--danger)';
    statusEl.textContent = '登録に失敗しました: ' + e.message;
  }
});

async function loadSchools(){
  const container = document.getElementById('school-list');
  container.innerHTML = '<div class="empty">読み込み中…</div>';
  try {
    const snap = await schoolsRef.get();
    schoolsMap = {};
    schoolsArr = snap.docs.map(d => ({ id:d.id, name: d.data().name || d.id }));
    schoolsArr.forEach(s => { schoolsMap[s.id] = s.name; });
    populateSchoolSelects();
    renderHQCalendarList();
    renderHQPatternsTable();
    if (snap.empty){ container.innerHTML = '<div class="empty">まだ校舎が登録されていません。</div>'; return; }
    const base = window.location.origin + window.location.pathname.replace(/hq\.html$/, '');
    const rows = await Promise.all(snap.docs.map(async (doc) => {
      const s = doc.data();
      let count = '-';
      try {
        const studentsSnap = await db.collection('academies').doc(doc.id).collection('students')
          .where('months.' + currentMonthKey(), '==', 'active').get();
        count = studentsSnap.size;
      } catch(e){ count = '?'; }
      const url = base + 'index.html?school=' + encodeURIComponent(doc.id);
      return `<div class="school-row">
        <div>
          <div class="school-name">${escAttr(s.name || doc.id)}</div>
          <div class="school-meta">ID: ${escAttr(doc.id)} ／ 今月の在籍: ${count}名</div>
        </div>
        <a class="link-btn" href="${escAttr(url)}" target="_blank" rel="noopener">開く</a>
      </div>`;
    }));
    container.innerHTML = rows.join('');
  } catch(e){
    container.innerHTML = '<div class="empty">読み込みに失敗しました: ' + escAttr(e.message) + '</div>';
  }
}

async function loadAbsenceReports(){
  const container = document.getElementById('absence-list');
  container.innerHTML = '<div class="empty">読み込み中…</div>';
  try {
    const snap = await db.collectionGroup('absenceReports').orderBy('absenceDate', 'desc').limit(30).get();
    if (snap.empty){ container.innerHTML = '<div class="empty">欠席連絡はまだありません。</div>'; return; }
    container.innerHTML = snap.docs.map(d => {
      const r = d.data();
      const academyId = d.ref.parent.parent.id;
      const schoolName = schoolsMap[academyId] || academyId;
      const statusBadge = r.status === 'new' ? '<span class="badge">未確認</span>' : '<span class="badge muted">確認済み</span>';
      const ackBtn = r.status === 'new' ? `<button class="ghost-small" data-ack="${academyId}|${d.id}">確認済みにする</button>` : '';
      return `<div class="absence-row">
        <strong>${escAttr(schoolName)}</strong> ${statusBadge}<br>
        ${escAttr(r.studentName||'')} ／ ${escAttr(r.absenceDate||'')} ／ ${escAttr(r.reason||'')}
        ${ackBtn ? '<div style="margin-top:6px;">' + ackBtn + '</div>' : ''}
      </div>`;
    }).join('');
  } catch(e){
    container.innerHTML = '<div class="empty">読み込みに失敗しました: ' + escAttr(e.message) + '</div>';
  }
}

document.getElementById('absence-list').addEventListener('click', async (e) => {
  const key = e.target.dataset.ack;
  if (!key) return;
  const [academyId, reportId] = key.split('|');
  try {
    await db.collection('academies').doc(academyId).collection('absenceReports').doc(reportId).update({ status:'acknowledged' });
    loadAbsenceReports();
  } catch(err){ alert('更新に失敗しました: ' + err.message); }
});

// ---- 統合スケジュール管理 ----
const WEEKDAY_LABELS = ['日','月','火','水','木','金','土'];
const WEEKDAY_NAMES = ['日曜','月曜','火曜','水曜','木曜','金曜','土曜'];
let allPatterns = [];
let allEvents = [];
let allLocations = {};
let schoolsArr = [];
let unsubPatternsGroup = null, unsubEventsGroup = null, unsubMetaGroup = null;

function dateStrOf(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function weekdayOf(dateStr){ return new Date(dateStr + 'T00:00:00').getDay(); }
function locationNameFor(academyId, locationId){
  const list = allLocations[academyId] || [];
  const l = list.find(x => x.id === locationId);
  return l ? l.name : '';
}
function schoolNameFor(academyId){ return schoolsMap[academyId] || academyId; }

function occurrencesForSchoolDate(academyId, dateStr){
  const wd = weekdayOf(dateStr);
  const results = [];
  allPatterns.filter(p => p.academyId === academyId && Number(p.weekday) === wd
    && (!p.startDate || dateStr >= p.startDate) && (!p.endDate || dateStr <= p.endDate)
  ).forEach(p => {
    const override = allEvents.find(e => e.academyId === academyId && e.date === dateStr && e.patternId === p.id);
    const merged = Object.assign({}, p, override || {});
    results.push({
      academyId, date:dateStr, patternId:p.id, eventId: override ? override.id : null,
      cancelled: !!(override && override.cancelled),
      startTime: merged.startTime, endTime: merged.endTime, locationId: merged.locationId,
      staffInCharge: merged.staffInCharge, targetGroup: merged.targetGroup, type: merged.type, note: merged.note
    });
  });
  allEvents.filter(e => e.academyId === academyId && e.date === dateStr && !e.patternId).forEach(e => {
    results.push({
      academyId, date:dateStr, patternId:null, eventId:e.id, cancelled: !!e.cancelled,
      startTime:e.startTime, endTime:e.endTime, locationId:e.locationId,
      staffInCharge:e.staffInCharge, targetGroup:e.targetGroup, type:e.type, note:e.note
    });
  });
  return results;
}

function occurrencesForAllDate(dateStr){
  let results = [];
  schoolsArr.forEach(s => { results = results.concat(occurrencesForSchoolDate(s.id, dateStr)); });
  results.sort((a,b) => (a.startTime||'').localeCompare(b.startTime||''));
  return results;
}

function calRowHTML(o){
  const d = new Date(o.date + 'T00:00:00');
  const dateLabel = (d.getMonth()+1) + '/' + d.getDate() + '(' + WEEKDAY_LABELS[d.getDay()] + ')';
  const cancelledTag = o.cancelled ? ' <span class="badge muted">中止</span>' : '';
  const key = o.academyId + '|' + o.date + '|' + (o.patternId||'') + '|' + (o.eventId||'');
  return `<div class="cal-row ${o.cancelled ? 'cancelled' : ''}">
    <div class="cr-date">${dateLabel}</div>
    <div class="cr-time">${escAttr(o.startTime||'')}${o.endTime ? '〜'+escAttr(o.endTime) : ''}</div>
    <div class="cr-body">
      <div class="cr-school">${escAttr(schoolNameFor(o.academyId))}</div>
      <div>${escAttr(o.type||'')}${cancelledTag}</div>
      <div class="cr-loc">📍 ${escAttr(locationNameFor(o.academyId, o.locationId) || '場所未設定')}</div>
      <div class="cr-staff">担当: ${escAttr(o.staffInCharge||'-')} ／ 対象: ${escAttr(o.targetGroup||'-')}</div>
    </div>
    <div class="cr-actions"><button class="ghost-small" data-edit-occ="${key}">編集</button></div>
  </div>`;
}

function renderHQCalendarList(){
  const container = document.getElementById('hq-calendar-list');
  if (!container) return;
  const today = new Date();
  const rows = [];
  for (let i = 0; i < 60; i++){
    const d = new Date(today); d.setDate(d.getDate() + i);
    occurrencesForAllDate(dateStrOf(d)).forEach(o => rows.push(o));
  }
  container.innerHTML = rows.length === 0 ? '<div class="empty">今後60日間の予定はありません。</div>' : rows.map(calRowHTML).join('');
}

function populateSchoolSelects(){
  const opts = schoolsArr.map(s => `<option value="${escAttr(s.id)}">${escAttr(s.name)}</option>`).join('');
  ['hq-new-occ-school','hq-new-pattern-school'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.innerHTML = opts;
  });
  populateLocationSelectFor('hq-new-occ-location', document.getElementById('hq-new-occ-school') ? document.getElementById('hq-new-occ-school').value : null);
}
function populateLocationSelectFor(selectId, academyId){
  const el = document.getElementById(selectId);
  if (!el) return;
  const list = allLocations[academyId] || [];
  el.innerHTML = '<option value="">(未選択)</option>' + list.map(l => `<option value="${escAttr(l.id)}">${escAttr(l.name)}</option>`).join('');
}

function renderHQPatternsTable(){
  const tbody = document.getElementById('hq-patterns-tbody');
  if (!tbody) return;
  if (allPatterns.length === 0){ tbody.innerHTML = '<tr><td colspan="5" class="status">定期パターンがありません</td></tr>'; return; }
  const sorted = [...allPatterns].sort((a,b) => schoolNameFor(a.academyId).localeCompare(schoolNameFor(b.academyId)) || Number(a.weekday)-Number(b.weekday));
  tbody.innerHTML = sorted.map(p => `
    <tr>
      <td>${escAttr(schoolNameFor(p.academyId))}</td>
      <td>${WEEKDAY_NAMES[Number(p.weekday)]||''}</td>
      <td>${escAttr(p.startTime||'')}〜${escAttr(p.endTime||'')}</td>
      <td>${escAttr(p.type||'')}</td>
      <td><button class="link-danger" data-del-pattern="${p.academyId}|${p.id}">削除</button></td>
    </tr>`).join('');
}

function openHQOccEditor(key){
  const [academyId, dateStr, patternId, eventId] = key.split('|');
  const occ = occurrencesForSchoolDate(academyId, dateStr).find(o => (o.patternId||'') === patternId);
  if (!occ) return;
  document.getElementById('hq-occ-editor').style.display = 'block';
  document.getElementById('hq-occ-hint').style.display = 'none';
  document.getElementById('hq-occ-school').value = schoolNameFor(academyId);
  document.getElementById('hq-occ-date').value = dateStr;
  document.getElementById('hq-occ-type').value = occ.type || '通常練習';
  document.getElementById('hq-occ-start').value = occ.startTime || '';
  document.getElementById('hq-occ-end').value = occ.endTime || '';
  populateLocationSelectFor('hq-occ-location', academyId);
  document.getElementById('hq-occ-location').value = occ.locationId || '';
  document.getElementById('hq-occ-staff').value = occ.staffInCharge || '';
  document.getElementById('hq-occ-target').value = occ.targetGroup || '';
  document.getElementById('hq-occ-note').value = occ.note || '';
  document.getElementById('hq-occ-cancelled').checked = occ.cancelled;
  document.getElementById('hq-occ-editor').dataset.academyId = academyId;
  document.getElementById('hq-occ-editor').dataset.date = dateStr;
  document.getElementById('hq-occ-editor').dataset.patternId = patternId || '';
  document.getElementById('hq-occ-editor').dataset.eventId = eventId || '';
  document.getElementById('hq-btn-reset-occ').style.display = (patternId && eventId) ? 'inline-block' : 'none';
  document.getElementById('hq-btn-delete-occ').style.display = (!patternId && eventId) ? 'inline-block' : 'none';
  document.getElementById('hq-occ-status').textContent = '';
}

document.getElementById('hq-calendar-list').addEventListener('click', (e) => {
  const key = e.target.dataset.editOcc;
  if (key) openHQOccEditor(key);
});

document.getElementById('hq-btn-save-occ').addEventListener('click', async () => {
  const editor = document.getElementById('hq-occ-editor');
  const academyId = editor.dataset.academyId;
  const dateStr = editor.dataset.date;
  const patternId = editor.dataset.patternId || null;
  const eventId = editor.dataset.eventId || null;
  const statusEl = document.getElementById('hq-occ-status');
  const payload = {
    date: dateStr, patternId: patternId || null,
    type: document.getElementById('hq-occ-type').value,
    startTime: document.getElementById('hq-occ-start').value,
    endTime: document.getElementById('hq-occ-end').value,
    locationId: document.getElementById('hq-occ-location').value || null,
    staffInCharge: document.getElementById('hq-occ-staff').value,
    targetGroup: document.getElementById('hq-occ-target').value,
    note: document.getElementById('hq-occ-note').value,
    cancelled: document.getElementById('hq-occ-cancelled').checked
  };
  const eventsRef = db.collection('academies').doc(academyId).collection('scheduleEvents');
  try {
    if (patternId){ await eventsRef.doc(patternId + '_' + dateStr).set(payload, { merge:true }); }
    else if (eventId){ await eventsRef.doc(eventId).set(payload, { merge:true }); }
    else { await eventsRef.add(payload); }
    statusEl.style.color = 'var(--accent-dark)';
    statusEl.textContent = '✓ 保存しました。';
  } catch(err){ statusEl.style.color = 'var(--danger)'; statusEl.textContent = '保存に失敗しました: ' + err.message; }
});
document.getElementById('hq-btn-reset-occ').addEventListener('click', async () => {
  const editor = document.getElementById('hq-occ-editor');
  const academyId = editor.dataset.academyId, dateStr = editor.dataset.date, patternId = editor.dataset.patternId;
  if (!patternId) return;
  if (!confirm('この日だけの変更を取り消しますか？')) return;
  try {
    await db.collection('academies').doc(academyId).collection('scheduleEvents').doc(patternId + '_' + dateStr).delete();
    editor.style.display = 'none';
    document.getElementById('hq-occ-hint').style.display = 'block';
  } catch(err){ alert('失敗しました: ' + err.message); }
});
document.getElementById('hq-btn-delete-occ').addEventListener('click', async () => {
  const editor = document.getElementById('hq-occ-editor');
  const academyId = editor.dataset.academyId, eventId = editor.dataset.eventId;
  if (!eventId) return;
  if (!confirm('この単発予定を削除しますか？')) return;
  try {
    await db.collection('academies').doc(academyId).collection('scheduleEvents').doc(eventId).delete();
    editor.style.display = 'none';
    document.getElementById('hq-occ-hint').style.display = 'block';
  } catch(err){ alert('失敗しました: ' + err.message); }
});

document.getElementById('hq-new-occ-school').addEventListener('change', (e) => {
  populateLocationSelectFor('hq-new-occ-location', e.target.value);
});
document.getElementById('hq-btn-add-occ').addEventListener('click', async () => {
  const statusEl = document.getElementById('hq-add-occ-status');
  const academyId = document.getElementById('hq-new-occ-school').value;
  const date = document.getElementById('hq-new-occ-date').value;
  if (!academyId){ statusEl.style.color = 'var(--danger)'; statusEl.textContent = '校舎を選択してください。'; return; }
  if (!date){ statusEl.style.color = 'var(--danger)'; statusEl.textContent = '日付を選択してください。'; return; }
  const payload = {
    date, patternId: null,
    type: document.getElementById('hq-new-occ-type').value,
    startTime: document.getElementById('hq-new-occ-start').value,
    endTime: document.getElementById('hq-new-occ-end').value,
    locationId: document.getElementById('hq-new-occ-location').value || null,
    staffInCharge: document.getElementById('hq-new-occ-staff').value,
    targetGroup: document.getElementById('hq-new-occ-target').value,
    note: document.getElementById('hq-new-occ-note').value,
    cancelled: false
  };
  try {
    await db.collection('academies').doc(academyId).collection('scheduleEvents').add(payload);
    statusEl.style.color = 'var(--accent-dark)';
    statusEl.textContent = '✓ 追加しました。';
  } catch(err){ statusEl.style.color = 'var(--danger)'; statusEl.textContent = '追加に失敗しました: ' + err.message; }
});

document.getElementById('hq-patterns-tbody').addEventListener('click', async (e) => {
  const key = e.target.dataset.delPattern;
  if (!key) return;
  const [academyId, patternId] = key.split('|');
  if (!confirm('この定期パターンを削除しますか？')) return;
  try { await db.collection('academies').doc(academyId).collection('schedulePatterns').doc(patternId).delete(); }
  catch(err){ alert('削除に失敗しました: ' + err.message); }
});
document.getElementById('hq-btn-add-pattern').addEventListener('click', async () => {
  const statusEl = document.getElementById('hq-add-pattern-status');
  const academyId = document.getElementById('hq-new-pattern-school').value;
  const weekday = Number(document.getElementById('hq-new-pattern-weekday').value);
  if (!academyId){ statusEl.style.color = 'var(--danger)'; statusEl.textContent = '校舎を選択してください。'; return; }
  try {
    await db.collection('academies').doc(academyId).collection('schedulePatterns').add({
      weekday, startTime:'17:00', endTime:'19:00', locationId:null, staffInCharge:'', targetGroup:'全学年', type:'通常練習', note:''
    });
    statusEl.style.color = 'var(--accent-dark)';
    statusEl.textContent = '✓ 追加しました。曜日・時間などは各校の管理画面から調整できます。';
  } catch(err){ statusEl.style.color = 'var(--danger)'; statusEl.textContent = '追加に失敗しました: ' + err.message; }
});

function attachHQCalendarListeners(){
  detachHQCalendarListeners();
  unsubPatternsGroup = db.collectionGroup('schedulePatterns').onSnapshot(snap => {
    allPatterns = snap.docs.map(d => Object.assign({ id:d.id, academyId: d.ref.parent.parent.id }, d.data()));
    renderHQCalendarList();
    renderHQPatternsTable();
  }, err => console.error(err));
  unsubEventsGroup = db.collectionGroup('scheduleEvents').onSnapshot(snap => {
    allEvents = snap.docs.map(d => Object.assign({ id:d.id, academyId: d.ref.parent.parent.id }, d.data()));
    renderHQCalendarList();
  }, err => console.error(err));
  unsubMetaGroup = db.collectionGroup('meta').onSnapshot(snap => {
    const map = {};
    snap.docs.forEach(d => { if (d.id === 'locations') map[d.ref.parent.parent.id] = d.data().items || []; });
    allLocations = map;
    renderHQCalendarList();
  }, err => console.error(err));
}
function detachHQCalendarListeners(){
  if (unsubPatternsGroup){ unsubPatternsGroup(); unsubPatternsGroup = null; }
  if (unsubEventsGroup){ unsubEventsGroup(); unsubEventsGroup = null; }
  if (unsubMetaGroup){ unsubMetaGroup(); unsubMetaGroup = null; }
}

auth.onAuthStateChanged(async (user) => {
  if (user && user.isAnonymous){ await auth.signOut(); return; }
  currentUser = user;
  if (!user){
    document.getElementById('login-card').style.display = 'block';
    document.getElementById('main-content').style.display = 'none';
    detachHQCalendarListeners();
    return;
  }
  let isHQ = false;
  try { const doc = await hqAdminsRef.doc(user.uid).get(); isHQ = doc.exists; }
  catch(e){ console.error(e); }
  if (!isHQ){
    document.getElementById('login-status').style.color = 'var(--danger)';
    document.getElementById('login-status').textContent = 'このアカウントには本部管理者権限がありません。';
    await auth.signOut();
    return;
  }
  document.getElementById('login-card').style.display = 'none';
  document.getElementById('main-content').style.display = 'block';
  document.getElementById('who').textContent = user.email + '(本部管理者)';
  document.getElementById('hq-new-occ-date').value = (() => { const d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); })();
  await loadSchools();
  loadAbsenceReports();
  attachHQCalendarListeners();
});
</script>
