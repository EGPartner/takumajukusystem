<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>福井遠征 試合スケジュール・会場</title>
<style>
:root{--bg:#fff;--text:#111;--sub:#707072;--line:#e5e5e5;--fill:#f5f5f5;--ink:#111;--on-ink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#111;--text:#fff;--sub:#9e9ea0;--line:#2e2e2e;--fill:#1c1c1c;--ink:#fff;--on-ink:#111}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","Noto Sans JP",sans-serif;font-size:16px;line-height:1.7;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
.wrap{max-width:600px;margin:0 auto;padding:28px max(20px,env(safe-area-inset-right)) calc(56px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
header{padding-bottom:28px}
header::before{content:"タクマ塾岩国校";display:block;font-size:13px;font-weight:700;letter-spacing:.08em;margin-bottom:20px}
h1{font-size:clamp(26px,7.4vw,38px);text-wrap:balance;font-weight:800;letter-spacing:-.02em;line-height:1.2;margin:0}
.sub,header p{margin:12px 0 0;color:var(--sub);font-size:15px}
.card{padding:32px 0;border-top:1px solid var(--line)}
.card h2{font-size:22px;font-weight:800;letter-spacing:-.01em;line-height:1.3;margin:0 0 18px}
.card p{margin:0 0 8px}
a{color:inherit;text-decoration:underline;text-underline-offset:3px}
table{width:100%;border-collapse:collapse}
th,td{padding:14px 0;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{width:6.4em;color:var(--sub);font-size:13px;font-weight:600;letter-spacing:.02em;padding-right:12px}
tr:last-child th,tr:last-child td{border-bottom:none}
td.r{text-align:right;white-space:nowrap}
tr.total td{font-weight:800;font-size:15px;border-bottom:none}
tr.total td.r{font-size:34px;letter-spacing:-.02em;line-height:1.1}
.toc{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.toc a{display:flex;align-items:center;gap:12px;min-height:60px;padding:14px 0;border-bottom:1px solid var(--line);text-decoration:none;font-weight:700;font-size:17px}
.toc .n{color:var(--sub);font-weight:600;font-size:14px;min-width:1.6em}
.toc .t{flex:1}
.toc .go{display:none}
.toc a::after{content:"→";font-size:18px}
.day{margin:30px 0 6px;padding:0 0 8px;border-bottom:2px solid var(--ink);color:var(--text);font-size:13px;font-weight:800;letter-spacing:.04em}
.card .day:first-child,.card h2+.day{margin-top:0}
ul.plain{margin:10px 0;padding-left:1.2em}
ul.plain li{padding:2px 0}
.leg{border-left:2px solid var(--ink);padding:2px 0 2px 14px;margin:14px 0}
.leg .tm{font-weight:800}
.leg .tr{color:var(--sub);font-size:14px}
.meta,.note,.warn{color:var(--sub);font-size:14px;margin:10px 0 0}
.pending{color:var(--sub);font-size:14px}
.callout{background:var(--fill);padding:16px;margin:0 0 8px;font-size:15px}
.urgent{background:var(--ink);color:var(--on-ink);padding:14px 16px;font-weight:800;margin-bottom:20px}
.btn{display:flex;align-items:center;justify-content:center;min-height:52px;margin-top:16px;padding:0 24px;border-radius:999px;background:var(--ink);color:var(--on-ink);font-weight:700;font-size:16px;text-decoration:none}
.btn+.note{margin-top:18px}
.top{display:inline-flex;align-items:center;min-height:48px;margin-top:12px;color:var(--sub);font-size:14px;text-decoration:none}
footer{margin-top:16px;padding-top:24px;border-top:1px solid var(--line);color:var(--sub);font-size:13px;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
<header id="top"><h1>福井遠征のご案内</h1><p>11月28日(土)〜29日(日)</p></header>
<section class="card"><h2>試合スケジュール・会場情報</h2>
<div class="day">11月28日(土)</div>
<ul class="plain">
<li>13:00〜夕方 デリアテール杯 観戦</li>
<li>会場：福井市体育館(11:00 会場入り)</li>
</ul>
<div class="day">11月29日(日)</div>
<ul class="plain">
<li>09:00〜12:00 FC町田トリアネーロとのトレーニングマッチ</li>
<li>会場：ゆうゆうパークあわら(サッカー場)</li>
</ul>
<a class="top" href="fukui-trip.html">◀ 福井遠征のご案内にもどる</a></section>
<footer>タクマ塾岩国校</footer>
</div>
</body>
</html>
