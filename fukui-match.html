<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>福井遠征 試合スケジュール・会場</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1f2933;--sub:#5f6c7b;--line:#e3e7ec;--accent:#0b6e4f;--accent-bg:#e7f4ee}
@media (prefers-color-scheme:dark){:root{--bg:#14181c;--card:#1d2328;--text:#e8ecef;--sub:#9aa7b3;--line:#2c353d;--accent:#5fd0a5;--accent-bg:#1c332b}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.75;font-size:16px}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 56px}
header h1{font-size:20px;margin:0 0 4px}
header p{margin:0;color:var(--sub);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:16px}
.card h2{font-size:17px;margin:0 0 10px}
.toc{list-style:none;margin:0;padding:0}
.toc li+li{margin-top:8px}
.toc a{display:flex;gap:10px;align-items:center;padding:12px;border-radius:10px;background:var(--accent-bg);color:var(--text);text-decoration:none}
.toc .n{font-weight:700;color:var(--accent);min-width:1.6em}
.toc .t{flex:1}
.toc .go{color:var(--accent);font-size:13px;white-space:nowrap}
.note{color:var(--sub);font-size:13px;margin-top:12px}
section{scroll-margin-top:12px}
.pending{color:var(--sub);font-size:14px}
.top{display:inline-block;margin-top:12px;font-size:13px;color:var(--accent);text-decoration:none}
.day{font-weight:700;margin:14px 0 6px;padding:6px 10px;border-radius:8px;background:var(--accent-bg);color:var(--accent);font-size:15px}
.day:first-of-type{margin-top:0}
ul.plain{margin:6px 0;padding-left:1.3em}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
td.r,th.r{text-align:right;white-space:nowrap}
tr.total td{font-weight:700;border-bottom:none;font-size:16px}
.leg{border-left:3px solid var(--accent);padding:2px 0 2px 12px;margin:10px 0}
.leg .tm{font-weight:700}
.leg .tr{color:var(--sub);font-size:14px}
.meta{color:var(--sub);font-size:14px;margin:6px 0 0}
.btn{display:block;text-align:center;padding:14px;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;text-decoration:none;font-size:17px}
@media (prefers-color-scheme:dark){.btn{color:#0b1f17}}
.callout{background:var(--accent-bg);border-left:4px solid var(--accent);border-radius:8px;padding:12px;margin:0 0 4px;font-size:15px}
.warn{font-size:14px;color:var(--sub);margin:12px 0 0}
footer{margin-top:28px;text-align:center;color:var(--sub);font-size:13px}
/* mobile */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent}
.wrap{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));padding-bottom:calc(88px + env(safe-area-inset-bottom))}
.toc a,.btn,.top{min-height:48px}
.top{display:inline-flex;align-items:center;padding:0 4px}
.fab{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));z-index:10;display:flex;align-items:center;min-height:48px;padding:0 18px;border-radius:24px;background:var(--accent);color:#fff;font-weight:700;font-size:14px;text-decoration:none;box-shadow:0 2px 10px rgba(0,0,0,.25)}
@media (prefers-color-scheme:dark){.fab{color:#0b1f17}}
@media (max-width:480px){
  .card{padding:14px}
  h1{font-size:19px}
  .toc .go{display:none}
  .toc a::after{content:"▶";color:var(--accent);font-size:13px}
  th,td{padding:10px 4px}
  .day{font-size:14px}
}
td a,p a,li a{color:var(--accent);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
<header id="top"><h1>福井遠征のご案内</h1><p>11月28日(土)〜29日(日)</p></header>
<section class="card"><h2>試合スケジュール・会場情報</h2>
<div class="day">11月28日(土)</div>
<ul class="plain">
<li>13:00〜夕方 デリアテール杯 観戦</li>
<li>会場：福井市体育館(11:00 会場入り)</li>
</ul>
<div class="day">11月29日(日)</div>
<ul class="plain">
<li>09:00〜12:00 FC町田トリアネーロとのトレーニングマッチ</li>
<li>会場：ゆうゆうパークあわら(サッカー場)</li>
</ul>
<a class="top" href="fukui-trip.html">◀ 福井遠征のご案内にもどる</a></section>
<footer>タクマ塾 運営事務局</footer>
</div>
</body>
</html>
