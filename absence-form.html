<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>欠席連絡 - タクマ塾</title>
<style>
  :root{
    --bg:#F6F5F0; --surface:#FFFFFF; --border:#DEDBCF; --border-strong:#C7C3B4;
    --text-primary:#1E241F; --text-secondary:#5B6058; --text-muted:#8B8F84;
    --accent:#1F6F4A; --accent-dark:#154D33; --danger:#B3413B; --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Hiragino Sans","Yu Gothic",-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text-primary);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px 22px;max-width:420px;width:100%;}
  h1{font-size:18px;margin:0 0 6px;}
  p.sub{font-size:13px;color:var(--text-secondary);margin:0 0 20px;}
  label{font-size:13px;color:var(--text-secondary);display:block;margin-bottom:5px;}
  input[type=text],input[type=date],select,textarea{width:100%;padding:10px 11px;border:1px solid var(--border-strong);border-radius:8px;font-size:16px;background:var(--surface);color:var(--text-primary);font-family:inherit;}
  select#f-school{font-weight:600;}
  textarea{resize:vertical;}
  .field{margin-bottom:16px;}
  .reason-group{display:flex;gap:8px;flex-wrap:wrap;}
  .reason-btn{flex:1 1 auto;padding:10px 8px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);font-size:14px;cursor:pointer;text-align:center;color:var(--text-primary);}
  .reason-btn.selected{background:var(--accent);color:#fff;border-color:var(--accent);}
  button.submit{width:100%;padding:13px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:6px;}
  button.submit:disabled{opacity:0.6;cursor:default;}
  .status{font-size:13px;margin-top:12px;text-align:center;min-height:18px;}
  .success{text-align:center;padding:20px 0;}
  .success .icon{font-size:40px;margin-bottom:10px;}
</style>
</head>
<body>
<div class="card" id="gate-card" style="display:none;">
  <h1>塾生のご家族専用ページ</h1>
  <p class="sub">確認のため、お子さまの情報を入力してください(この端末で初回のみ)。</p>
  <div id="gate-form">
    <div class="field"><label for="gate-school">お子さまの校舎</label><select id="gate-school"><option value="">読み込み中…</option></select></div>
    <div class="field"><label for="gate-name">塾生のお名前(姓名)</label><input type="text" id="gate-name" placeholder="例: 山田 蓮"></div>
    <button type="button" class="submit" id="gate-submit">利用を開始する</button>
    <p class="status" id="gate-status"></p>
  </div>
  <div id="gate-pending" style="display:none;text-align:center;padding:10px 0;">
    <p style="font-weight:700;font-size:14px;margin:0 0 6px;">申請を受け付けました</p>
    <p class="sub" style="margin:0;">入力されたお名前が名簿と一致しなかったため、教室の確認をお待ちください。<br>確認が済むと、このページが自動で切り替わります。</p>
  </div>
</div>

<div class="card" id="form-card" style="display:none;">
  <h1>欠席連絡</h1>
  <p class="sub">練習を欠席する場合、こちらからご連絡ください。</p>

  <div class="field">
    <label for="f-school">校舎を選択</label>
    <select id="f-school"><option value="">読み込み中…</option></select>
  </div>
  <div class="field">
    <label for="f-name">選手の氏名(姓名)</label>
    <input type="text" id="f-name" placeholder="例: 山田 蓮">
  </div>
  <div class="field">
    <label for="f-grade">学年</label>
    <select id="f-grade">
      <option value="">選択してください</option>
      <option value="年少">年少</option>
      <option value="年中">年中</option>
      <option value="年長">年長</option>
      <option value="小1">小1</option>
      <option value="小2">小2</option>
      <option value="小3">小3</option>
      <option value="小4">小4</option>
      <option value="小5">小5</option>
      <option value="小6">小6</option>
      <option value="中1">中1</option>
      <option value="中2">中2</option>
      <option value="中3">中3</option>
      <option value="その他">その他</option>
    </select>
  </div>
  <div class="field">
    <label for="f-date">欠席日</label>
    <input type="date" id="f-date">
  </div>
  <div class="field">
    <label>理由</label>
    <div class="reason-group" id="reason-group">
      <button type="button" class="reason-btn" data-reason="体調不良">体調不良</button>
      <button type="button" class="reason-btn" data-reason="私用">私用</button>
      <button type="button" class="reason-btn" data-reason="その他">その他</button>
    </div>
  </div>
  <div class="field">
    <label for="f-note">備考(任意)</label>
    <textarea id="f-note" rows="3" placeholder="伝えておきたいことがあれば"></textarea>
  </div>

  <button type="button" class="submit" id="btn-submit">送信する</button>
  <p class="status" id="form-status"></p>
  <p class="status" style="margin-top:16px;"><a href="parent-menu.html" style="color:var(--accent-dark);text-decoration:none;">← メニューへ戻る</a></p>
</div>

<div class="card" id="success-card" style="display:none;">
  <div class="success">
    <div class="icon">✓</div>
    <h1>連絡を受け付けました</h1>
    <p class="sub" style="margin-bottom:0;">ご連絡ありがとうございました。</p>
    <p class="status" style="margin-top:16px;"><a href="parent-menu.html" style="color:var(--accent-dark);text-decoration:none;">← メニューへ戻る</a></p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDKTuN49WGP1pFobS6rS_RwDnDvzJe1h00",
  authDomain: "takuma-juku-iwakuni.firebaseapp.com",
  projectId: "takuma-juku-iwakuni",
  storageBucket: "takuma-juku-iwakuni.firebasestorage.app",
  messagingSenderId: "1065956673618",
  appId: "1:1065956673618:web:e765409502a9b87031b78b"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const schoolsRef = db.collection('schools');

function escAttr(v){ return String(v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

const LAST_SCHOOL_KEY = 'takumajuku_last_school';

async function loadSchoolOptions(){
  const sel = document.getElementById('f-school');
  try {
    const snap = await schoolsRef.orderBy('name').get();
    if (snap.empty){
      sel.innerHTML = '<option value="">校舎が登録されていません</option>';
      document.getElementById('btn-submit').disabled = true;
      return;
    }
    sel.innerHTML = '<option value="">選択してください</option>' + snap.docs.map(d => `<option value="${d.id}">${escAttr(d.data().name || d.id)}</option>`).join('');
    const remembered = localStorage.getItem(LAST_SCHOOL_KEY);
    if (remembered && snap.docs.some(d => d.id === remembered)) sel.value = remembered;
  } catch(e){
    console.error(e);
    sel.innerHTML = '<option value="">読み込みに失敗しました</option>';
  }
}
loadSchoolOptions();

let selectedReason = null;

document.querySelectorAll('.reason-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.reason-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedReason = btn.dataset.reason;
  });
});

function todayStr(){
  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
}
document.getElementById('f-date').value = todayStr();
document.getElementById('f-date').min = todayStr();

async function ensureSignedIn(){
  if (auth.currentUser) return auth.currentUser;
  const cred = await auth.signInAnonymously();
  return cred.user;
}

// ---- 塾生名簿との照合による関門(塾生家庭以外の利用を防ぐ) ----
function normalizeName(n){ return String(n || '').replace(/[\s　]/g, ''); }
function showForm(prefillName){
  document.getElementById('gate-card').style.display = 'none';
  document.getElementById('form-card').style.display = 'block';
  if (prefillName) document.getElementById('f-name').value = prefillName;
}
function showPending(uid){
  document.getElementById('gate-card').style.display = 'block';
  document.getElementById('gate-form').style.display = 'none';
  document.getElementById('gate-pending').style.display = 'block';
  db.collection('parentViewers').doc(uid).onSnapshot(doc => {
    if (doc.exists && doc.data().status === 'approved') showForm(doc.data().studentName || '');
  }, err => console.error(err));
}
async function loadGateSchoolOptions(){
  const sel = document.getElementById('gate-school');
  try {
    const snap = await schoolsRef.orderBy('name').get();
    sel.innerHTML = '<option value="">選択してください</option>' + snap.docs.map(d => `<option value="${d.id}">${escAttr(d.data().name || d.id)}</option>`).join('');
    let remembered = null;
    try { remembered = localStorage.getItem(LAST_SCHOOL_KEY); } catch(e){}
    if (remembered && snap.docs.some(d => d.id === remembered)) sel.value = remembered;
  } catch(e){ console.error(e); sel.innerHTML = '<option value="">読み込みに失敗しました</option>'; }
}
async function initGate(){
  try {
    const user = await ensureSignedIn();
    const doc = await db.collection('parentViewers').doc(user.uid).get();
    if (doc.exists){
      if (doc.data().status === 'approved'){ showForm(); return; }
      showPending(user.uid);
      return;
    }
  } catch(e){ console.error(e); }
  document.getElementById('gate-card').style.display = 'block';
  loadGateSchoolOptions();
}
document.getElementById('gate-submit').addEventListener('click', async () => {
  const statusEl = document.getElementById('gate-status');
  const schoolId = document.getElementById('gate-school').value;
  const name = document.getElementById('gate-name').value.trim();
  if (!schoolId){ statusEl.style.color = 'var(--danger)'; statusEl.textContent = '校舎を選択してください。'; return; }
  if (!name){ statusEl.style.color = 'var(--danger)'; statusEl.textContent = '塾生のお名前を入力してください。'; return; }
  statusEl.style.color = 'var(--text-secondary)';
  statusEl.textContent = '確認しています…';
  try {
    const user = await ensureSignedIn();
    try { localStorage.setItem(LAST_SCHOOL_KEY, schoolId); } catch(e){}
    const base = { studentName: name, nameKey: normalizeName(name), schoolId, createdAt: firebase.firestore.FieldValue.serverTimestamp() };
    try {
      await db.collection('parentViewers').doc(user.uid).set(Object.assign({ status: 'approved' }, base));
      showForm(name);
    } catch(e1){
      await db.collection('parentViewers').doc(user.uid).set(Object.assign({ status: 'pending' }, base));
      showPending(user.uid);
    }
  } catch(e){
    console.error(e);
    statusEl.style.color = 'var(--danger)';
    statusEl.textContent = '確認に失敗しました。もう一度お試しください。';
  }
});
initGate();

document.getElementById('btn-submit').addEventListener('click', async () => {
  const statusEl = document.getElementById('form-status');
  const btn = document.getElementById('btn-submit');
  const schoolId = document.getElementById('f-school').value;
  const name = document.getElementById('f-name').value.trim();
  const date = document.getElementById('f-date').value;
  const note = document.getElementById('f-note').value.trim();

  if (!schoolId){ statusEl.style.color = 'var(--danger)'; statusEl.textContent = '校舎を選択してください。'; return; }
  if (!name){ statusEl.style.color = 'var(--danger)'; statusEl.textContent = '選手の氏名を入力してください。'; return; }
  if (!date){ statusEl.style.color = 'var(--danger)'; statusEl.textContent = '欠席日を選択してください。'; return; }
  if (!selectedReason){ statusEl.style.color = 'var(--danger)'; statusEl.textContent = '理由を選択してください。'; return; }

  btn.disabled = true;
  statusEl.style.color = 'var(--text-secondary)';
  statusEl.textContent = '送信しています…';

  try {
    await ensureSignedIn();
    await db.collection('academies').doc(schoolId).collection('absenceReports').add({
      studentName: name,
      grade: document.getElementById('f-grade').value || '',
      absenceDate: date,
      reason: selectedReason,
      note: note,
      status: 'new',
      submittedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    try { localStorage.setItem(LAST_SCHOOL_KEY, schoolId); } catch(e){}
    document.getElementById('form-card').style.display = 'none';
    document.getElementById('success-card').style.display = 'block';
  } catch(err){
    console.error(err);
    statusEl.style.color = 'var(--danger)';
    statusEl.textContent = '送信に失敗しました: ' + (err && err.message ? err.message : String(err));
    btn.disabled = false;
  }
});
</script>
</body>
</html>
