<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#14284A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AI本部">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="robots" content="noindex">
<title>タクマ塾 AI本部</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=Outfit:wght@500;600;700&family=DotGothic16&display=swap">
<style>
  /* Layout: ドット絵のオフィス(上段=ラウンジ・会議室・統括室・事務局、下段=4P各部)を主役に、右にサマリ/決裁/記録のパネル、下に動きのティッカー */
  :root{
    --bg:#E9F0F0; --surface:#FFFFFF; --surface-2:#F4F8F8; --line:#D8E3E3; --line-strong:#BFD0D0;
    --ink:#0F1C1E; --ink-2:#4D6264; --ink-3:#88A0A2;
    --accent:#0FB8C4; --accent-ink:#087A83; --accent-soft:#DDF4F5;
    --ok:#1F9D63; --ok-soft:#E1F3E9; --warn:#C98300; --warn-soft:#FFF2D6; --bad:#D2483C; --bad-soft:#FCE7E4; --idle:#9AAAAC;
    --navy:#14284A;
    --shadow:0 18px 40px -22px rgba(15,28,30,.35);
    --f-display:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif;
    --f-body:'Noto Sans JP','Hiragino Sans','Yu Gothic',-apple-system,sans-serif;
    --f-num:'Outfit','Noto Sans JP',sans-serif;
    --f-pixel:'DotGothic16','Noto Sans JP',monospace;
    --r:14px;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#0B1416; --surface:#121E21; --surface-2:#172629; --line:#22363A; --line-strong:#2F4A4F;
    --ink:#E6F0F0; --ink-2:#A3B8BA; --ink-3:#6E8689;
    --accent:#2FCAD5; --accent-ink:#7FE2E9; --accent-soft:#123A3E;
    --ok:#3CC487; --ok-soft:#123326; --warn:#E8A93A; --warn-soft:#3A2C10; --bad:#F06B5F; --bad-soft:#3D1A17; --idle:#5E7477;
    --navy:#0A1830; --shadow:0 18px 40px -22px rgba(0,0,0,.75); color-scheme:dark; } }
  :root[data-theme="dark"]{
    --bg:#0B1416; --surface:#121E21; --surface-2:#172629; --line:#22363A; --line-strong:#2F4A4F;
    --ink:#E6F0F0; --ink-2:#A3B8BA; --ink-3:#6E8689;
    --accent:#2FCAD5; --accent-ink:#7FE2E9; --accent-soft:#123A3E;
    --ok:#3CC487; --ok-soft:#123326; --warn:#E8A93A; --warn-soft:#3A2C10; --bad:#F06B5F; --bad-soft:#3D1A17; --idle:#5E7477;
    --navy:#0A1830; --shadow:0 18px 40px -22px rgba(0,0,0,.75); color-scheme:dark; }

  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
  .num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  .wrap{max-width:1480px;margin:0 auto;padding-inline:16px;padding-block:14px 32px}
  @media (min-width:720px){.wrap{padding-inline:24px}}

  /* 上部バー */
  .bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .brand{flex:none;display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:12px;background:var(--navy);color:#fff;min-width:0}
  .brand b{font-family:var(--f-display);font-weight:900;font-size:16px;white-space:nowrap}
  .live{font-family:var(--f-num);font-size:10.5px;font-weight:700;letter-spacing:.08em;color:#7FF0B5;display:inline-flex;align-items:center;gap:5px}
  .live i{width:7px;height:7px;border-radius:50%;background:#3CE38E;animation:blink 1.6s infinite}
  @keyframes blink{50%{opacity:.25}}
  .spacer{flex:1}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;padding:6px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap;cursor:default}
  button.chip{cursor:pointer}
  button.chip:hover{border-color:var(--accent)}
  .chip b{font-family:var(--f-num);color:var(--ink);font-size:13px}
  .chip.alarm{background:var(--bad);border-color:var(--bad);color:#fff}
  .chip.alarm b{color:#fff}
  .chip.decide{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
  .chip.sample{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--idle);flex:none;display:inline-block}
  .dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.idle{background:var(--idle)} .dot.bad{background:var(--bad)}

  /* ステージ */
  .stage-wrap{position:relative;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
  .scroller{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .stage{position:relative;width:100%;min-width:760px;aspect-ratio:640/352;max-width:100%}
  .mnav{display:none}
  @media (max-width:719px){
    .wrap{padding-block:12px 96px}
    .bar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
    .bar::-webkit-scrollbar{display:none}
    .bar .sample,#btn-panel,#theme-btn,.bar .spacer{display:none}
    .stage{min-width:0;width:100%}
    .zoom .stage{width:760px;min-width:760px;max-width:none}
    .zl{font-size:8.5px;padding:0 4px}
    .zoom .zl{font-size:11px;padding:1px 7px}
    .hint{font-size:10px;bottom:6px}
    .foot{font-size:11px}
    .mnav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
    .mnav button{border:0;background:none;padding:6px 0;font-size:11px;color:var(--ink-2);display:grid;justify-items:center;gap:2px;cursor:pointer;position:relative}
    .mnav svg{width:22px;height:22px}
    .mnav .on{color:var(--accent-ink);font-weight:700}
    .mnav .badge{position:absolute;top:1px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;font-family:var(--f-num);display:grid;place-items:center;padding:0 4px}
    .toast{bottom:88px}
  }
  #scene{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer}
  .zl{position:absolute;transform:translateY(-50%);font-family:var(--f-pixel);font-size:clamp(10px,.95vw,13px);color:#26393C;background:rgba(255,255,255,.82);padding:1px 7px;border-radius:6px;white-space:nowrap;pointer-events:none;border:1px solid rgba(0,0,0,.08)}
  .zl.p{color:#fff;border:0}
  .zl .c{font-family:var(--f-num);font-weight:700;margin-left:4px}
  .hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-size:11.5px;color:#fff;background:rgba(15,28,30,.62);padding:4px 12px;border-radius:999px;pointer-events:none;white-space:nowrap}
  .pop{position:absolute;z-index:5;width:min(280px,80%);background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;font-size:12.5px}
  .pop h4{margin:0 0 4px;font-family:var(--f-display);font-size:14px;display:flex;gap:6px;align-items:center}
  .pop .t{color:var(--ink-2)}
  .pop .k{color:var(--ink-3);font-size:11px;margin-top:6px}
  .pop .x{position:absolute;top:6px;right:8px;border:0;background:none;cursor:pointer;color:var(--ink-3);font-size:16px;line-height:1}

  /* ティッカー */
  .ticker{display:flex;align-items:center;gap:10px;margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;overflow:hidden}
  .ticker .lb{font-size:11.5px;font-weight:700;color:#fff;background:var(--navy);padding:3px 9px;border-radius:7px;white-space:nowrap}
  .ticker .track{flex:1;min-width:0;overflow:hidden;white-space:nowrap;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
  .ticker .run{display:inline-block;animation:tick 300s linear infinite;font-size:12.5px;color:var(--ink-2)}
  .ticker:hover .run,.ticker.hold .run{animation-play-state:paused}
  .ticker .run span{margin-right:28px}
  .ticker .run b{color:var(--accent-ink);font-weight:700;margin:0 6px}
  .ticker .run .tm{font-family:var(--f-num);color:var(--ink-3)}
  @keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}

  /* 右パネル(PC)/下からのシート(スマホ) */
  .panel{position:absolute;top:12px;right:12px;bottom:12px;width:360px;max-width:calc(100% - 24px);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;z-index:6;overflow:hidden}
  .panel[hidden]{display:none}
  @media (max-width:1100px){
    .panel{position:fixed;top:auto;left:0;right:0;bottom:0;width:auto;max-width:none;max-height:78%;border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);z-index:30}
  }
  @media (min-width:1281px){ .stage-wrap.with-panel .scroller{margin-right:360px} .stage-wrap.with-panel .panel{top:0;right:0;bottom:0;border-radius:0;border:0;border-left:1px solid var(--line);box-shadow:none} }
  .tabs{display:flex;gap:4px;padding:10px 10px 0;border-bottom:1px solid var(--line)}
  .tabs button{white-space:nowrap;border:0;background:none;padding:8px 8px;font-size:13px;font-weight:700;color:var(--ink-3);border-bottom:2px solid transparent;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
  .tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
  .tabs .n{font-family:var(--f-num);font-size:11px;background:var(--bad);color:#fff;border-radius:8px;padding:0 6px;min-width:18px;text-align:center}
  .tabs .close{margin-left:auto;font-size:18px;color:var(--ink-3)}
  .pbody{padding:12px 14px;overflow:auto;flex:1;display:grid;align-content:start;gap:12px}
  .alertbox{border-radius:10px;background:var(--bad-soft);padding:10px 12px;font-size:12.5px}
  .alertbox b{color:var(--bad);display:block;margin-bottom:2px}
  .mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .mini div{background:var(--surface-2);border-radius:10px;padding:8px 10px;min-width:0}
  .mini .k{font-size:11px;color:var(--ink-3)}
  .mini .v{font-family:var(--f-num);font-weight:700;font-size:18px;line-height:1.2;white-space:nowrap}
  .mini .v small{font-family:var(--f-body);font-size:11px;font-weight:500;color:var(--ink-3)}
  .mini .real{font-size:10px;color:var(--ok)}
  table.sum{width:100%;border-collapse:collapse;font-size:12.5px}
  table.sum th{font-size:11px;color:var(--ink-3);font-weight:500;text-align:left;padding:4px 4px;border-bottom:1px solid var(--line)}
  table.sum td{padding:7px 4px;border-bottom:1px solid var(--line)}
  table.sum td.r,table.sum th.r{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
  table.sum tr{cursor:pointer}
  table.sum tr:hover td{background:var(--surface-2)}
  .sec-h{font-size:12px;font-weight:700;color:var(--ink-2);margin-top:2px}
  .todo li{font-size:12.5px;margin:3px 0}
  .todo{margin:0;padding-left:18px}

  .card{border:1px solid var(--line);border-radius:12px;padding:12px;transition:opacity .35s,transform .35s}
  .card.leaving{opacity:0;transform:translateX(20px)}
  .card-h{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
  .pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);white-space:nowrap}
  .pill.due{background:var(--warn-soft);color:var(--warn)}
  .card h3{font-family:var(--f-display);font-size:14.5px;margin:2px 0 6px;line-height:1.45}
  .row{display:grid;grid-template-columns:58px minmax(0,1fr);gap:6px;font-size:12.5px;padding:5px 0;border-top:1px dashed var(--line)}
  .row .lb{color:var(--ink-3);font-size:11.5px}
  .row.rec .bd{font-weight:700}
  .row.dis .lb{color:var(--bad)}
  .row.dis .bd{color:var(--ink-2)}
  .ev{display:flex;gap:4px;flex-wrap:wrap}
  .ev span{font-size:11px;padding:1px 7px;border-radius:6px;background:var(--surface-2);color:var(--ink-2)}
  .actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:8px 12px;font-weight:700;font-size:12.5px;cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;flex:1 1 110px}
  .btn.ghost{border-color:transparent;color:var(--ink-2)}
  .cond{margin-top:8px;display:grid;gap:6px}
  .cond textarea{width:100%;min-height:64px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface-2);padding:8px;font:inherit;font-size:12.5px;color:var(--ink);resize:vertical}
  .empty{padding:24px 10px;text-align:center;color:var(--ink-2);border:1px dashed var(--line-strong);border-radius:12px;font-size:12.5px}
  .empty b{display:block;font-family:var(--f-display);color:var(--ink);font-size:14px;margin-bottom:2px}
  .log{list-style:none;margin:0;padding:0}
  .log li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:12.5px}
  .log li:first-child{border-top:0}
  .log .tm{font-family:var(--f-num);color:var(--ink-3);font-size:11.5px}
  .log .who{font-weight:700;color:var(--accent-ink);font-size:11.5px}
  .log li.new{animation:flash 1.8s ease}
  @keyframes flash{from{background:var(--accent-soft)}to{background:transparent}}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .cmdwrap{margin-top:10px;display:grid;gap:8px}
  .cmd{display:flex;align-items:flex-end;gap:8px;background:var(--surface);border:1px solid var(--line-strong);border-radius:16px;padding:8px;box-shadow:var(--shadow)}
  .cmd:focus-within{border-color:var(--accent)}
  .sec-badge{align-self:center;display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);padding:6px 10px;border-radius:999px;white-space:nowrap}
  .sec-badge i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
  .cmd textarea{flex:1;min-width:0;border:0;background:transparent;resize:none;font:inherit;font-size:14.5px;color:var(--ink);padding:9px 4px;max-height:120px;outline:none;line-height:1.5}
  .mic{width:42px;height:42px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface-2);display:grid;place-items:center;cursor:pointer;flex:none;color:var(--ink-2)}
  .mic:hover{border-color:var(--accent);color:var(--accent-ink)}
  .mic.rec{background:var(--bad);border-color:var(--bad);color:#fff;animation:blink 1.2s infinite}
  .send{height:42px;padding:0 18px;border-radius:12px;border:0;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;flex:none}
  .route{background:var(--surface);border:1px solid var(--accent);border-radius:14px;padding:12px 14px;display:grid;gap:8px;font-size:13px;box-shadow:var(--shadow)}
  .route .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .route .to{font-weight:700;font-family:var(--f-display);font-size:15px}
  .route .q{color:var(--ink-2)}
  .route .spacer{flex:1}
  .route .btn.primary{flex:none}
  .route select{font:inherit;font-size:12.5px;border:1px solid var(--line-strong);border-radius:8px;padding:5px 6px;background:var(--surface-2);color:var(--ink);max-width:100%}
  .bar2{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
  .bar2 i{display:block;height:100%;width:0;background:var(--accent)}
  .tag{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-3);white-space:nowrap}
  .cmd-mini{display:flex;gap:6px;margin-top:8px;align-items:flex-start}
  .cmd-mini textarea{flex:1;min-width:0;min-height:46px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface-2);padding:8px;font:inherit;font-size:12.5px;color:var(--ink);resize:vertical}
  @media (max-width:719px){
    .wrap{padding-block:12px 200px}
    .cmdwrap{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));padding:8px 10px 6px;z-index:24;background:linear-gradient(to bottom,transparent,var(--bg) 22%);margin:0}
    .sec-badge{display:none}
    .send{padding:0 12px}
    .toast{bottom:150px}
  }
  .orders{list-style:none;margin:0;padding:0;display:grid;gap:8px}
  .oi{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .oh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .oh .tm{font-family:var(--f-num);font-size:11.5px;color:var(--ink-3)}
  .oh .who{font-weight:700;font-size:12.5px;color:var(--accent-ink);min-width:0}
  .st{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
  .st.ok{background:var(--ok-soft);color:var(--ok)} .st.warn{background:var(--warn-soft);color:var(--warn)}
  .btn.chk{margin-left:auto;padding:5px 10px;font-size:12px}
  .ot{font-size:13px;margin-top:4px}
  .mini-bar,.pbar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:8px}
  .mini-bar i,.pbar i{display:block;height:100%;background:var(--accent);transition:width .6s}
  .pbar{height:8px}
  .od{margin-top:8px;display:grid;gap:8px;border-top:1px dashed var(--line);padding-top:8px}
  .pk{font-size:11.5px;color:var(--ink-3)}
  .steps{margin:0;padding-left:20px;font-size:12.5px;display:grid;gap:3px}
  .steps li.done{color:var(--ink-3);text-decoration:line-through}
  .steps li.now{font-weight:700;color:var(--accent-ink)}
  .steps .tag{margin-left:6px}
  .cl{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:12px}
  .cl .tm{font-family:var(--f-num);color:var(--ink-3);margin-right:6px}
  .outbox{display:grid;gap:4px;width:100%;text-align:left;background:var(--ok-soft);border:1px solid transparent;border-radius:10px;padding:10px 12px;font-size:12.5px;cursor:pointer;color:var(--ink)}
  button.outbox:hover{border-color:var(--ok)}
  .outbox b{font-size:13px}
  .outbox .more{font-size:11.5px;font-weight:700;color:var(--ok)}
  .outbox.wait{background:var(--surface-2);color:var(--ink-2);cursor:default}
  .viewer{position:fixed;inset:0;z-index:70;background:rgba(8,16,18,.48);display:grid;place-items:center;padding:24px}
  .viewer[hidden]{display:none}
  .vbox{width:min(860px,100%);max-height:100%;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
  .vhead{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
  .vhead h3{margin:0;font-family:var(--f-display);font-size:18px;line-height:1.4}
  .vhead .pk{margin-top:2px}
  .vhead .x{margin-left:auto;border:0;background:none;font-size:22px;line-height:1;color:var(--ink-3);cursor:pointer;padding:4px}
  .vbody{padding:16px 18px;overflow:auto;display:grid;gap:14px;font-size:13.5px}
  .v-sum{margin:0;font-size:14.5px;font-weight:500;background:var(--accent-soft);border-radius:10px;padding:10px 12px}
  .v-table{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
  .v-table table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:520px}

/* 移動: 廊下(上段と下段の間)を通る */
function zoneOf(x, y) { return y < 10 * T ? 'top' : 'bottom'; }
/* 移動の指示はキャラクターごとに順番待ちにする(移動中に別の用件が来ても、今の用件を上書きしない) */
function walkTo(a, tx, ty, then) {
  const job = { tx, ty, then };
  if (a.walking) { (a.jobs || (a.jobs = [])).push(job); return; }
  startWalk(a, job);
}
function startWalk(a, job) {
  const [X, Y] = [job.tx * T, job.ty * T];
  const pts = [];
  const sameBand = zoneOf(a.x, a.y) === zoneOf(X, Y) && Math.abs(a.x - X) < 6 * T;
  if (sameBand) { pts.push([X, a.y], [X, Y]); }
  else { pts.push([a.x, CORRIDOR], [X, CORRIDOR], [X, Y]); }
  a.walking = true; a.path = pts;
  a.onArrive = () => {
    a.walking = false;
    if (job.then) job.then();
    const next = a.jobs && a.jobs.shift();
    if (next) { if (a.walking) a.jobs.unshift(next); else startWalk(a, next); }
  };
}

let ORG = null;

function buildActors(org) {

    d.teams.forEach((t, i) => {
      const s = SEAT_SLOTS[Math.min(i, SEAT_SLOTS.length - 1)];
      t.desk = [z.x + s[0], s[1]];
      t.actor = mkActor({ kind: 'team', team: t, dept: d, name: t.name, desk: t.desk, home: t.desk });

  chair = mkActor({ kind: 'chair', name: '議長(顧客責任者)', home: MEETING_SEATS.chair, task: 'PMF指標と顧客の声を持ち、会議の結論をまとめる' });
  audit = mkActor({ kind: 'audit', name: '監査役', home: MEETING_SEATS.audit, task: 'どの議題にも反対意見とリスクを出す' });
  boss = mkActor({ kind: 'boss', name: '統括(山口さん)', home: [27, 5], desk: [27, 5], task: '部長会議の結論だけを決裁する' });
  const infraSeats = [[25.2, 7.4], [27.6, 7.6]], secSeats = [[33, 4], [36, 4], [33, 7], [36, 7]];
  let ii = 0, si = 0;
  org.staff.forEach(s => {

  messenger = staffActors['sec-minutes'] || secretary;

function targets() {
  const list = [];

    list.push({ id: 'head-' + d.id, kind: 'head', dept: d.id, name: d.p + '部長', unit: d.p + '部' });

  });
  ORG.staff.forEach(s => list.push({ id: s.id, kind: 'staff', name: s.name, unit: s.unit }));
  list.push({ id: 'meeting', kind: 'meeting', name: '部長会議', unit: '会議体' });
  return list;
}
const targetOf = id => targets().find(t => t.id === id) || null;
const targetName = id => { if (id === 'cxo') return '統括直属 CXO秘書'; const t = targetOf(id); return !t ? id : t.kind === 'meeting' ? '部長会議' : t.unit + ' ' + t.name; };
const deptName = id => { const d = ORG.depts.find(x => x.id === id); return d ? d.p + '部' : ''; };
function actorOfTarget(t) { if (!t) return null; if (t.kind === 'team') return t.team.actor; if (t.kind === 'head') return heads[t.dept]; if (t.kind === 'staff') return staffActors[t.id]; return chair; }

const seen = {};
let firstSnapshot = true;
function deliverBy(courier, t, label) {
  if (!t || !courier) return;
  courier.carry = true;
  const back = () => { courier.carry = false; walkTo(courier, courier.home[0], courier.home[1]); };
  walkTo(courier, 25.6, 6.2);
  if (t.kind === 'meeting') return walkTo(courier, MEETING_SEATS.chair[0] - 1, MEETING_SEATS.chair[1], () => { say(chair, 'talk', 2.5); back(); });
  if (t.kind === 'staff') { const a = staffActors[t.id]; return walkTo(courier, a.desk[0] - 1.2, a.desk[1] + .2, () => { say(a, 'ok', 2.5); back(); }); }
  const h = heads[t.dept];
  walkTo(courier, h.desk[0] + 1.2, h.desk[1] + .2, () => say(h, 'ok', 1.5));
  if (t.kind === 'head') return walkTo(courier, h.desk[0] + 1.2, h.desk[1] + .2, back);
  const a = t.team.actor;
  walkTo(courier, a.desk[0] + 1.2, a.desk[1] + .2, () => { say(a, 'ok', 2.5); back(); });
}
function animateStage(o, prev) {
  const t = targetOf(o.target), actor = actorOfTarget(t);
  const own = o.askingDept || (t && t.dept);
  switch (o.stage) {
    case 'executing': if (!prev) deliverBy(secretary, t); break;
    case 'consult_head':
      if (t && t.kind === 'team') {
        const h = heads[t.dept], a = t.team.actor; a.carry = true;
        walkTo(a, h.desk[0] + 1.2, h.desk[1] + .2, () => { say(a, 'talk', 2.6); say(h, 'talk', 2.6); setTimeout(() => { a.carry = false; walkTo(a, a.desk[0], a.desk[1]); }, 2700); });
      }
      break;
    case 'cross_consult': {
      const h = heads[own]; if (!h) break;
      h.carry = true;
      (o.related || []).filter(d => d !== own && heads[d]).forEach(d => {
        const oh = heads[d];
        walkTo(h, oh.desk[0] - 1.2, oh.desk[1] + .2, () => { say(h, 'talk', 2.2); say(oh, 'talk', 2.2); });
      });
      walkTo(h, h.desk[0], h.desk[1], () => { h.carry = false; });
      break;
    }
    case 'meeting': {
      const ids = [...new Set([own, ...(o.related || [])].filter(d => heads[d]))];
      ids.forEach((d, i) => { const h = heads[d], seat = MEETING_SEATS.heads[i % MEETING_SEATS.heads.length]; walkTo(h, seat[0], seat[1], () => { say(h, 'talk', 5); setTimeout(() => walkTo(h, h.desk[0], h.desk[1]), 5200); }); });
      say(chair, 'talk', 6); say(audit, 'talk', 6);
      break;
    }
    case 'awaiting_decision':
      chair.carry = true;
      walkTo(chair, 25.6, 5.2, () => { chair.carry = false; say(boss, 'doc', 3); });
      walkTo(chair, MEETING_SEATS.chair[0], MEETING_SEATS.chair[1]);
      toast(`指示#${o.no}が決裁に上がりました`);
      break;
    case 'reviewing': say(audit, 'doc', 5); break;
    case 'awaiting_adoption':
      audit.carry = true;
      walkTo(audit, 25.6, 5.2, () => { audit.carry = false; say(boss, 'doc', 3); });
      walkTo(audit, MEETING_SEATS.audit[0], MEETING_SEATS.audit[1]);
      toast(`指示#${o.no}の成果物が採用の決裁に上がりました`);
      break;
    case 'producing': if (prev === 'awaiting_decision' || prev === 'awaiting_adoption') deliverBy(messenger, t); if (actor) say(actor, 'doc', 5); break;
    case 'done': if (actor) say(actor, 'ok', 5); if (prev !== 'done' && prev !== 'awaiting_adoption') toast(`指示#${o.no}が完了しました。成果物を確認できます`); break;
    case 'error': case 'paused_quota': if (actor) say(actor, 'alert', 5); toast(`指示#${o.no}が止まりました: ${o.error || stageLabel(o.stage)}`); break;
  }
}

function loadLogo(src, lo, hi) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
      const g = c.getContext('2d'); g.drawImage(img, 0, 0);
      const d = g.getImageData(0, 0, c.width, c.height), p = d.data;
      let x0 = c.width, y0 = c.height, x1 = 0, y1 = 0;
      for (let i = 0; i < p.length; i += 4) {
        const dark = 255 - (p[i] * .3 + p[i + 1] * .59 + p[i + 2] * .11);
        const al = Math.max(0, Math.min(1, (dark - lo) / (hi - lo)));
        p[i] = p[i + 1] = p[i + 2] = 255; p[i + 3] = Math.round(al * 255);
        if (al > .3) { const k = i / 4, x = k % c.width, y = (k / c.width) | 0; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
      }
      g.putImageData(d, 0, 0);
      if (x1 <= x0) return resolve(null);
      const o = document.createElement('canvas'); o.width = x1 - x0 + 1; o.height = y1 - y0 + 1;
      o.getContext('2d').drawImage(c, x0, y0, o.width, o.height, 0, 0, o.width, o.height);
      resolve(o);
    };
    img.onerror = () => resolve(null);
    img.src = src;
  });
}
function stamp(c, logo, cx, cy, h, alpha) {
  if (!logo) return;
  const w = Math.round(h * logo.width / logo.height);
  const t = document.createElement('canvas'); t.width = w; t.height = h;
  const g = t.getContext('2d'); g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high'; g.drawImage(logo, 0, 0, w, h);
  const d = g.getImageData(0, 0, w, h); for (let i = 3; i < d.data.length; i += 4) d.data[i] = d.data[i] > 110 ? 255 : 0; g.putImageData(d, 0, 0);
  c.save(); c.globalAlpha = alpha; c.drawImage(t, Math.round(cx - w / 2), Math.round(cy - h / 2)); c.restore();
}

  const bar = $('#route-bar'); bar.style.width = '0%';
  requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.transition = `width ${Math.max(0, draft.deadline - performance.now())}ms linear`; bar.style.width = '100%'; }));
  $('#route-sel').addEventListener('change', e => { draft.target = e.target.value; draft.by = 'manual'; draft.reason = ''; startCountdown(); });
  $('#route-cancel').addEventListener('click', () => { clearTimeout(draftTimer); draft = null; renderRoute(); toast('業務命令を取り消しました'); });
  $('#route-now').addEventListener('click', sendDraft);
}
function startCountdown() { clearTimeout(draftTimer); draft.deadline = performance.now() + CONFIRM_MS; draftTimer = setTimeout(sendDraft, CONFIRM_MS); renderRoute(); }
async function sendDraft() {
  clearTimeout(draftTimer);
  const d = draft; if (!d || d.loading) return;
  draft = null; renderRoute();
  const payload = { text: d.text, target: d.target, instruction: d.instruction, due: d.due, steps: d.steps, needsDecision: d.needsDecision, needsResearch: d.needsResearch, needsData: d.needsData, costYen: d.costYen, related: d.related, question: d.question, output: d.output, by: d.by };
  try {
    const r = await call('aiSubmitOrder')({ draft: payload }); toast(`指示#${r.data.no}を伝達しました`);
    if (voiceLink) { const v = voices.find(x => x.id === voiceLink); call('aiVoiceSave')({ id: voiceLink, linkedOrderNo: r.data.no, ...(v && (v.status || '未対応') === '未対応' ? { status: '対応中' } : {}) }).catch(() => {}); voiceLink = null; }
  }
  catch (e) { toast('送信できませんでした: ' + e.message); }
}
async function submitCommand(text) {
  if (draft && !draft.loading) await sendDraft();
  draft = { text, loading: true }; renderRoute(); say(secretary, 'talk', 10);
  try {
    const r = await call('aiDraftOrder')({ text });
    if (!draft || draft.text !== text) return;
    draft = { ...r.data };
    if (draft.aiError) toast('AIの判断が使えなかったため、キーワードで宛先を決めました');
    startCountdown();
  } catch (e) { draft = null; renderRoute(); toast('AI秘書に届きませんでした: ' + e.message); }
}

/* ---------- 音声入力(ブラウザの音声認識) ---------- */
let recog = null;
function startVoice(id, btn) {
  const ta = document.getElementById(id);
  if (recog) { recog.stop(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('このブラウザは音声入力に対応していません。スマホはキーボードのマイクボタンを使ってください'); ta.focus(); return; }
  const r = new SR(); r.lang = 'ja-JP'; r.interimResults = true;
  const base = ta.value ? ta.value + ' ' : '';
  r.onresult = e => { let s = ''; for (let i = 0; i < e.results.length; i++) s += e.results[i][0].transcript; ta.value = base + s; ta.dispatchEvent(new Event('input')); };
  r.onerror = e => toast(e.error === 'not-allowed' ? 'マイクの使用が許可されていません。ブラウザの設定で許可してください' : '音声を聞き取れませんでした');
  r.onend = () => { btn.classList.remove('rec'); recog = null; };
  r.start(); recog = r; btn.classList.add('rec');
}

/* ---------- 操作 ---------- */
const cmdText = $('#cmd-text');
setPlaceholder();
function autosize() { cmdText.style.height = 'auto'; cmdText.style.height = Math.min(cmdText.scrollHeight, 120) + 'px'; }
cmdText.addEventListener('input', autosize);
cmdText.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#cmd').requestSubmit(); } });
$('#cmd').addEventListener('submit', e => {
  e.preventDefault();
  const text = cmdText.value.trim();
  if (!text) { cmdText.focus(); toast(inputMode === 'consult' ? '相談の内容を入力するか、マイクで話してください' : '業務命令を入力するか、マイクで話してください'); return; }
  cmdText.value = ''; autosize();
  if (inputMode === 'consult') consultCommand(text); else submitCommand(text);
});
function setMode(mode) { const b = document.querySelector(`[data-mode="${mode}"]`); if (b) b.click(); }
document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => {
  inputMode = b.dataset.mode;
  document.querySelectorAll('[data-mode]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  $('#cmd').classList.toggle('consult', inputMode === 'consult');
  document.querySelector('.send .lb').textContent = inputMode === 'consult' ? '相談する' : '指示する';
  document.querySelector('.send').setAttribute('aria-label', inputMode === 'consult' ? '相談する' : '指示する');
  setPlaceholder(); cmdText.focus();
}));
/** CXO秘書への相談: 部署に回さず直接答える(答えは成果物の窓で開く。記録は指示の一覧に「相談」として残る) */
async function consultCommand(text) {
  const el = $('#route');
  el.hidden = false;
  el.innerHTML = `<div class="h"><span class="pill">CXO秘書</span><span>考えています…(20秒ほど。最新の情報を調べるときは1分ほど)</span></div><div class="q">「${esc(text)}」</div>`;
  say(secretary, 'talk', 30);
  try {
    const r = await fns.httpsCallable('aiConsult', { timeout: 300000 })({ text });
    el.hidden = true; el.innerHTML = '';
    toast(`相談#${r.data.no}にCXO秘書が答えました`);
    const open = (tries = 0) => { const o = orders.find(x => x.id === r.data.id); if (o) openViewer(o); else if (tries < 20) setTimeout(() => open(tries + 1), 300); };
    open();
  } catch (e) { el.hidden = true; el.innerHTML = ''; toast('相談できませんでした: ' + e.message); }
}
document.addEventListener('click', async e => {
  const btn = e.target.closest('button');
  const mic = e.target.closest('[data-mic]'); if (mic) return startVoice(mic.dataset.mic, mic);
  const ov = e.target.closest('[data-view-output]'); if (ov) { const o = orders.find(x => x.id === ov.dataset.viewOutput); if (o) openViewer(o); return; }
  if (e.target.closest('[data-go-decide]')) { panelTab = 'decide'; renderPanel(); return; }
  const tr = e.target.closest('tr[data-focus]');
  if (tr) { const z = ZONES[tr.dataset.focus]; if (z) { const sc = document.querySelector('.scroller'); sc.scrollTo({ left: Math.max(0, z.x * T / W * sc.scrollWidth - 40), behavior: 'smooth' }); } return; }
  if (!btn) return;
  if (btn.dataset.reopenOpen) { const f = document.getElementById('ro-' + btn.dataset.reopenOpen); if (f) { f.hidden = !f.hidden; if (!f.hidden) f.querySelector('textarea').focus(); } return; }
  if (btn.dataset.reopen) {
    const id = btn.dataset.reopen, ta = document.getElementById('rr-' + id), note = ta ? ta.value.trim() : '';
    if (!note) { ta.focus(); toast('再審査の理由や、見直してほしい点を書いてください'); return; }
    btn.disabled = true;
    try { const r = await call('aiReopenOrder')({ orderId: id, note }); toast(`指示#${r.data.no}を再審査に回しました。もう一度、決裁に上がります`); const t2 = document.getElementById('rr-' + id); if (t2) t2.value = ''; }
    catch (err) { btn.disabled = false; toast('再審査に回せませんでした: ' + err.message); }
    return;
  }
  if (btn.id === 'voice-save') {
    const ta = $('#voice-text'), text = ta.value.trim();
    if (!text) { ta.focus(); toast('代表の意見を入力するか、マイクで話してください'); return; }
    btn.disabled = true;
    try { const r = await call('aiVoiceSave')({ text, saidAt: $('#voice-date').value, channel: $('#voice-channel').value }); const t2 = document.getElementById('voice-text'); if (t2) t2.value = ''; toast(`代表の意見#${r.data.no}を登録しました`); }
    catch (err) { toast('登録できませんでした: ' + err.message); }
    btn.disabled = false;
    return;
  }
  if (btn.dataset.vf) { voiceFilter = btn.dataset.vf; renderPanel(); return; }
  if (btn.dataset.vsave) {
    const id = btn.dataset.vsave; btn.disabled = true;
    try { await call('aiVoiceSave')({ id, note: (document.getElementById('vn-' + id) || {}).value || '' }); toast('メモを保存しました'); }
    catch (err) { toast('保存できませんでした: ' + err.message); }
    btn.disabled = false; return;
  }
  if (btn.dataset.vorder || btn.dataset.vconsult) {
    const v = voices.find(x => x.id === (btn.dataset.vorder || btn.dataset.vconsult)); if (!v) return;
    setMode(btn.dataset.vconsult ? 'consult' : 'order');
    cmdText.value = btn.dataset.vconsult ? `代表タクマの意見#${v.no}「${v.text}」について、どう対応すべきか` : `代表タクマの意見#${v.no}「${v.text}」を受けて: `;
    voiceLink = btn.dataset.vorder ? v.id : null;
    autosize(); cmdText.focus();
    toast(btn.dataset.vconsult ? 'CXO秘書への相談として入力しました。内容を確かめて送ってください' : '業務命令として入力しました。続きを書いて送ると、この意見と結びつきます');
    return;
  }
  if (btn.dataset.adopt) {
    const id = btn.dataset.id, kind = btn.dataset.adopt, ta = document.getElementById('ad-' + id), note = ta ? ta.value.trim() : '';
    if (kind !== 'adopt' && !note) { ta.focus(); toast(kind === 'reject' ? '不採用の理由を書いてください' : '直してほしい点を書いてください'); return; }
    btn.disabled = true;
    try { await call('aiAdoptOrder')({ orderId: id, kind, note }); toast({ adopt: '採用しました', revise: '修正を指示しました', reject: '不採用にしました' }[kind]); }
    catch (err) { btn.disabled = false; toast('送れませんでした: ' + err.message); }
    return;
  }
  if (btn.dataset.retry) {
    btn.disabled = true;
    try { await call('aiRetryOrder')({ orderId: btn.dataset.retry }); toast('やり直しを始めました。止まった段階から再開します'); }
    catch (err) { btn.disabled = false; toast('やり直せませんでした: ' + err.message); }
    return;
  }
  if (btn.dataset.ptab) { panelTab = btn.dataset.ptab; renderPanel(); }
  if (btn.dataset.order) { const id = btn.dataset.order; openOrders.has(id) ? openOrders.delete(id) : openOrders.add(id); renderPanel(); }
  if (['approve', 'back', 'drop', 'adopt', 'revise', 'reject'].includes(btn.dataset.act)) {
    const id = btn.dataset.id, ta = document.getElementById('ins-' + id), note = ta ? ta.value.trim() : '';
    if (['back', 'revise', 'reject'].includes(btn.dataset.act) && !note) { ta.focus(); toast(btn.dataset.act === 'reject' ? '不採用の理由を書いてください' : btn.dataset.act === 'revise' ? '直してほしい点を書いてください' : '差し戻しの理由を書くか、マイクで話してください'); return; }
    btn.disabled = true;
    if (btn.dataset.act === 'drop' && !confirm('この案件を取り下げますか?(これ以上AIの費用はかかりません)')) return;
    const kind = btn.dataset.act === 'approve' ? (note ? 'cond' : 'approve') : btn.dataset.act;
    try { await call('aiDecide')({ decisionId: id, kind, note }); toast({ approve: '承認しました。担当が実行を再開します', cond: '条件付きで承認しました', back: '差し戻しました。部長会議が次の案を作ります', drop: '取り下げました', adopt: '採用しました', revise: '修正を指示しました。係が直してもう一度上げます', reject: '不採用にしました' }[kind]); }
    catch (err) { btn.disabled = false; toast('決裁を送れませんでした: ' + err.message); }
  }
});
$('#v-close').addEventListener('click', closeViewer);
document.addEventListener('change', async e => {
  const sel = e.target.closest && e.target.closest('select[data-vs]'); if (!sel) return;
  try { await call('aiVoiceSave')({ id: sel.dataset.vs, status: sel.value }); toast(`状態を「${sel.value}」にしました`); }
  catch (err) { toast('変更できませんでした: ' + err.message); }
});
// 成果物の「次にやること」を、そのまま業務命令の入力欄へ(AI秘書が係の名前から宛先を判断する)
document.addEventListener('click', e => {
  const b = e.target.closest('[data-next]'); if (!b) return;
  const o = orders.find(x => x.id === b.dataset.oid) || viewing; if (!o || !o.deliverable) return;
  const item = (o.deliverable.next || [])[Number(b.dataset.next)] || '';
  if (!$('#viewer').hidden) closeViewer();
  cmdText.value = `${item}(指示#${o.no}「${o.deliverable.title}」を受けて)`; autosize(); cmdText.focus();
  toast('内容を確かめて「指示する」を押してください');
});
$('#viewer').addEventListener('click', e => { if (e.target.id === 'viewer') closeViewer(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#viewer').hidden) closeViewer(); });
$('#v-pdf').addEventListener('click', () => {
  const o = viewing; if (!o) return;
  const area = $('#print-area'), d = new Date(), title = document.title;
  area.innerHTML = `<div class="ph"><b>タクマ塾</b><span>${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()} 作成</span></div><h1>${esc(o.deliverable.title)}</h1><div class="pm">${esc($('#v-meta').textContent)}</div>${$('#v-body').innerHTML}`;
  document.body.classList.add('printing');
  document.title = `${o.deliverable.title}_指示${o.no}`; // 保存するPDFのファイル名になる
  const done = () => { document.body.classList.remove('printing'); document.title = title; area.innerHTML = ''; window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  window.print();
  toast('印刷の画面で「PDFに保存」を選んでください');
});
$('#v-copy').addEventListener('click', () => { navigator.clipboard.writeText(deliverableText(viewing)).then(() => toast('成果物をコピーしました'), () => toast('コピーできませんでした')); });
$('#v-fix').addEventListener('click', () => { const o = viewing; closeViewer(); cmdText.value = `指示#${o.no}の成果物「${o.deliverable.title}」を修正して: `; autosize(); cmdText.focus(); });
$('#chip-decide').addEventListener('click', () => openPanel('decide'));
document.querySelector('.ticker').addEventListener('click', e => e.currentTarget.classList.toggle('hold'));
$('#chip-alarm').addEventListener('click', () => openPanel('sum'));
$('#btn-panel').addEventListener('click', () => $('#panel').hidden ? openPanel('sum') : closePanel());
$('#panel-close').addEventListener('click', closePanel);
cv.addEventListener('click', e => {
  const r = cv.getBoundingClientRect();
  const lx = (e.clientX - r.left) / r.width * W, ly = (e.clientY - r.top) / r.height * H;
  let hit = null, best = Math.max(12, 22 / (r.width / W));
  actors.forEach(a => { const d = Math.hypot(lx - (a.x + 8), ly - (a.y + 8)); if (d < best) { best = d; hit = a; } });
  hidePop(); if (hit) { showPop(hit, e.clientX, e.clientY); $('#hint').hidden = true; }
});
function showPop(a, cx, cy) {
  const st = a.kind === 'team' ? teamState(a.team.id) : 'ok';
  const task = a.kind === 'team' ? teamTask(a.team.id) : a.task;
  const div = document.createElement('div'); div.className = 'pop'; div.id = 'pop';
  div.innerHTML = `<button class="x" type="button" aria-label="閉じる">×</button><h4><i class="dot ${st}"></i>${esc(a.name)}</h4><div class="t">${esc(task)}</div>${a.team && a.team.kpi ? `<div class="k">担当: ${esc(a.team.duty)} ・ KPI: ${esc(a.team.kpi)}</div>` : ''}`;
  const stage = $('#stage'), r = stage.getBoundingClientRect();
  div.style.left = Math.min(Math.max(8, cx - r.left + 12), r.width - 290) + 'px'; div.style.top = Math.min(Math.max(8, cy - r.top - 20), r.height - 120) + 'px';
  stage.appendChild(div); div.querySelector('.x').addEventListener('click', hidePop);
}
function hidePop() { const p = document.getElementById('pop'); if (p) p.remove(); }
function setZoom(on) { document.querySelector('.stage-wrap').classList.toggle('zoom', on); $('#m-zoom-l').textContent = on ? '全体' : '拡大'; try { localStorage.setItem('aihq-zoom', on ? '1' : '0'); } catch (e) {} }
$('#m-zoom').addEventListener('click', () => setZoom(!document.querySelector('.stage-wrap').classList.contains('zoom')));
document.querySelectorAll('[data-m]').forEach(b => b.addEventListener('click', () => { const t = b.dataset.m; if (isMobile()) return setMobileView(t); if (!$('#panel').hidden && panelTab === t) closePanel(); else openPanel(t); }));
const THEMES = [['', '自動'], ['light', 'ライト'], ['dark', 'ダーク']];
let themeIdx = 0;
try { themeIdx = Math.max(0, THEMES.findIndex(x => x[0] === (localStorage.getItem('aihq-theme') || ''))); } catch (e) {}
function applyTheme() { const [v, l] = THEMES[themeIdx]; if (v) document.documentElement.dataset.theme = v; else delete document.documentElement.dataset.theme; $('#theme-btn').textContent = '表示: ' + l; try { localStorage.setItem('aihq-theme', v); } catch (e) {} }
$('#theme-btn').addEventListener('click', () => { themeIdx = (themeIdx + 1) % 3; applyTheme(); });
applyTheme();
setInterval(() => { $('#clock').textContent = hm(new Date()); }, 1000);

/* ---------- ログインと起動 ---------- */
function showGate(msg) { $('#gate').hidden = false; $('#gate-msg').textContent = msg; $('#app').hidden = true; }
let started = false;
auth.onAuthStateChanged(async user => {
  if (!user || user.isAnonymous) return showGate('AI本部は統括(本部の管理者)専用です。管理システムにログインしてから開いてください。');
  const [a, s] = await Promise.all([db.doc('hqAdmins/' + user.uid).get().catch(() => null), db.doc('systemAdmins/' + user.uid).get().catch(() => null)]);
  if (!(a && a.exists) && !(s && s.exists)) return showGate('このアカウントには統括(本部の管理者)の権限がありません。');
  if (started) return;
  started = true;
  $('#gate').hidden = true; $('#app').hidden = false;
  try { ORG = (await call('aiOrg')()).data; }
  catch (e) { return showGate('組織の構成を読み込めませんでした: ' + e.message); }
  buildActors(ORG); renderLabels();
  const [em, br] = await Promise.all([loadLogo(LOGO_SRC.emblem, 40, 170), loadLogo(LOGO_SRC.brush, 12, 48)]);
  buildBackground(em, br);
  requestAnimationFrame(tick);
  setInterval(moveActors, 50);
  db.collection('aiOrders').orderBy('createdAt', 'desc').limit(60).onSnapshot(snap => {
    const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (!firstSnapshot) list.forEach(o => { if (seen[o.id] !== o.stage) animateStage(o, seen[o.id]); });
    list.forEach(o => { seen[o.id] = o.stage; });
    firstSnapshot = false; orders = list; renderAll();
  }, e => toast('指示を読み込めませんでした: ' + e.message));
  db.collection('aiDecisions').where('status', '==', 'pending').onSnapshot(snap => { decisions = snap.docs.map(d => ({ id: d.id, ...d.data() })); renderAll(); });
  db.collection('aiLogs').orderBy('at', 'desc').limit(50).onSnapshot(snap => { logs = snap.docs.map(d => d.data()); renderAll(); });
  db.collection('aiDecisions').orderBy('decidedAt', 'desc').limit(20).onSnapshot(snap => { decided = snap.docs.map(d => ({ id: d.id, ...d.data() })); if (panelTab === 'decide') renderPanel(); });
  db.collection('aiRepVoices').orderBy('createdAt', 'desc').limit(200).onSnapshot(snap => { voices = snap.docs.map(d => ({ id: d.id, ...d.data() })); renderAll(); }, e => console.error(e));
  const day = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
  db.doc('aiUsage/' + day).onSnapshot(s => { usage = s.exists ? s.data() : null; renderCounts(); });
  db.doc('aiMeta/apiKey').onSnapshot(s => { apiKeyMeta = s.exists ? s.data() : null; if (panelTab === 'sum') renderAll(); });
  if (isMobile()) setMobileView('sum');
  let panelOpen = !isMobile() && window.innerWidth > 1100;
  try { const v = localStorage.getItem('aihq-panel'); if (v !== null) panelOpen = v === '1' && window.innerWidth > 1100; } catch (e) {}
  if (panelOpen) openPanel('sum');
  else if (isMobile()) setMobileView('sum');
  try { if (localStorage.getItem('aihq-zoom') === '1') setZoom(true); } catch (e) {}
  renderAll();
});
