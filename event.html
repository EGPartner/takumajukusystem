<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>タクマ塾 イベントのご案内</title>
<style>
:root{color-scheme:light;--blue:#111;--navy:#000;--garnet:#111;--gold:#d4d4d4;--bg:#f2f2f2;--card:#fff;--text:#111;--sub:#6b6b6b;--line:#e2e2e2;--tint:#f4f4f4}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans","Noto Sans JP",sans-serif;font-size:16px;line-height:1.7;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
.wrap{padding:0}
header{position:relative;background:linear-gradient(160deg,#2b2b2b 0%,#000 100%);color:#fff;padding:36px max(20px,env(safe-area-inset-right)) 64px max(20px,env(safe-area-inset-left));clip-path:polygon(0 0,100% 0,100% calc(100% - 22px),0 100%)}
header>*{max-width:640px;margin-left:auto;margin-right:auto}
header::before{content:"タクマ塾";display:block;max-width:640px;margin:0 auto 18px;color:var(--gold);font-size:13px;font-weight:800;letter-spacing:.14em}
h1{font-size:clamp(24px,6.8vw,38px);font-weight:900;letter-spacing:-.01em;line-height:1.25;margin-top:0;margin-bottom:0;text-wrap:balance}
.sub,header p{margin-top:12px;margin-bottom:0;color:var(--gold);font-size:16px;font-weight:800;letter-spacing:.04em}
.stripe{height:6px;background:repeating-linear-gradient(90deg,#111 0 28px,#a3a3a3 28px 56px)}
.card,footer{max-width:640px}
.card{background:var(--card);margin:16px max(16px,env(safe-area-inset-left));border-radius:16px;padding:24px 20px;box-shadow:0 2px 12px rgba(0,0,0,.08);border-top:4px solid var(--blue)}
@media (min-width:700px){.card{margin-left:auto;margin-right:auto}}
header+.card,.stripe+.card{margin-top:-18px;position:relative}
.card h2{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:900;color:var(--blue);line-height:1.3;margin:0 0 16px}
.card h2::before{content:"";flex:none;width:6px;height:1.1em;background:var(--garnet);border-radius:3px}
.card p{margin:0 0 8px}
a{color:var(--blue);text-decoration:underline;text-underline-offset:3px;font-weight:700}
table{width:100%;border-collapse:collapse}
th,td{padding:13px 0;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{width:6.4em;color:var(--blue);font-size:13px;font-weight:800;padding-right:12px}
tr:last-child th,tr:last-child td{border-bottom:none}
td.r{text-align:right;white-space:nowrap}
tr.total td{font-weight:800;font-size:15px}
tr.total td.r{color:var(--blue);font-size:34px;font-weight:900;letter-spacing:-.02em;line-height:1.1}
.toc{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.toc a{display:flex;align-items:center;gap:12px;min-height:60px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--tint);color:var(--text);text-decoration:none;font-weight:800;font-size:16px}
.toc .n{color:var(--garnet);font-weight:900;min-width:1.6em}
.toc .t{flex:1}
.toc .go{display:none}
.toc a::after{content:"›";flex:none;width:30px;height:30px;border-radius:50%;background:var(--garnet);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1;padding-bottom:3px}
.day{display:block;margin:26px 0 10px;padding:8px 12px;border-radius:8px;background:var(--blue);color:#fff;font-size:14px;font-weight:800;letter-spacing:.02em}
.card h2+.day,.card .day:first-child{margin-top:0}
ul.plain{margin:10px 0;padding-left:1.2em}
ul.plain li{padding:3px 0}
ul.plain li::marker{color:var(--garnet)}
.leg{border-left:3px solid var(--garnet);padding:2px 0 2px 14px;margin:14px 0}
.leg .tm{font-weight:800}
.leg .tr{color:var(--sub);font-size:14px}
.meta,.note,.warn{color:var(--sub);font-size:14px;margin:10px 0 0}
.pending{color:var(--sub);font-size:14px}
.callout{background:var(--tint);border-left:4px solid var(--blue);border-radius:8px;padding:14px 16px;margin:0 0 8px;font-size:15px}
.urgent{background:var(--garnet);color:#fff;border-radius:10px;padding:14px 16px;font-weight:800;margin-bottom:18px}
.btn{display:flex;align-items:center;justify-content:center;min-height:54px;margin-top:16px;padding:0 24px;border-radius:999px;background:var(--garnet);color:#fff;font-weight:800;font-size:16px;text-decoration:none;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.btn+.note{margin-top:18px}
.top{display:inline-flex;align-items:center;min-height:48px;margin-top:12px;color:var(--blue);font-size:14px;text-decoration:none}
.poster{padding:12px}
.poster img{display:block;width:100%;height:auto;border-radius:10px}
.poster .note{text-align:center;margin:10px 0 2px}
footer{margin:32px 0 0;max-width:none;background:var(--navy);color:#fff;text-align:center;padding:28px 20px calc(28px + env(safe-area-inset-bottom));font-size:14px;font-weight:800;letter-spacing:.08em}
.shot{margin:14px 0 0}
.shot img{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
.shot figcaption{color:var(--sub);font-size:13px;margin-top:8px;text-align:center}

.ev{display:block;text-decoration:none;color:var(--text);font-weight:400}
.ev .when{display:inline-block;background:var(--blue);color:#fff;border-radius:6px;padding:3px 10px;font-size:13px;font-weight:800;letter-spacing:.02em}
.ev .ttl{font-size:19px;font-weight:900;line-height:1.35;margin:10px 0 4px}
.ev .sm{color:var(--sub);font-size:14px;margin:0}
.ev .badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.badge{font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;border:1px solid var(--blue);color:var(--blue)}
.badge.on{background:var(--blue);color:#fff}
.ev .go{margin-top:12px;font-size:14px;font-weight:800}
.empty{color:var(--sub);text-align:center;padding:12px 0}
.back{display:inline-flex;align-items:center;min-height:48px;margin:8px max(16px,env(safe-area-inset-left)) 0;font-size:14px}
.f{margin:0 0 14px}
.f label{display:block;font-size:14px;font-weight:800;margin-bottom:6px}
.f select,.f input,.f textarea{width:100%;min-height:48px;border:1px solid #cfcfcf;border-radius:10px;padding:10px 12px;font:inherit;background:#fff;color:var(--text)}
.f textarea{min-height:84px}
.btn[disabled]{opacity:.5}
.msg{margin:12px 0 0;font-size:14px;font-weight:700}
.msg.err{color:#b00020}
.who{background:var(--tint);border-radius:10px;padding:10px 14px;font-size:14px;margin:0 0 14px}

.ld{display:grid;justify-items:center;gap:10px;padding:18px 0;color:var(--sub);font-size:13px;font-weight:700}
.ld img{width:56px;height:56px;border-radius:50%;box-shadow:0 0 0 3px #e2e2e2;animation:ldspin 1.1s linear infinite}
@keyframes ldspin{to{transform:rotate(360deg)}}
@keyframes ldpulse{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.ld img{animation:ldpulse 1.4s ease-in-out infinite}}
</style>
</head>
<body>
<div class="wrap">
<header id="top"><h1 id="h1">読み込み中…</h1><p id="sub"></p></header>
<div class="stripe"></div>
<main id="body"><div class="card"><div class="ld"><img src="icon-192.png" alt="" width="56" height="56"><span>読み込んでいます…</span></div></div></main>
<a class="back" href="events.html">◀ イベント一覧にもどる</a>
<footer>タクマ塾</footer>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="takuma-busy.js"></script>
<script>const firebaseConfig = {
  apiKey: "AIzaSyDKTuN49WGP1pFobS6rS_RwDnDvzJe1h00",
  authDomain: "takuma-juku-iwakuni.firebaseapp.com",
  projectId: "takuma-juku-iwakuni",
  storageBucket: "takuma-juku-iwakuni.firebasestorage.app",
  messagingSenderId: "1065956673618",
  appId: "1:1065956673618:web:e765409502a9b87031b78b"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();

const HOOK="https://script.google.com/macros/s/AKfycbw2iDqtyycsiUNLALl7PvTedMzgQ1d4YKddizYtJafSP9y6FDeIPDMB8ZadP1lCIkht/exec";
const WD=["日","月","火","水","木","金","土"];
function pd(s){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||"");return m?new Date(+m[1],+m[2]-1,+m[3]):null}
function fd(d){return (d.getMonth()+1)+"月"+d.getDate()+"日("+WD[d.getDay()]+")"}
function range(s,e){const a=pd(s),b=pd(e);if(!a)return"";if(!b||s===e)return fd(a);return fd(a)+"〜"+(a.getMonth()===b.getMonth()?b.getDate()+"日("+WD[b.getDay()]+")":fd(b))}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function safeUrl(u){u=String(u||"").trim();return /^https:\/\//.test(u)||/^[A-Za-z0-9_\-\.\/]+$/.test(u)&&!/^\/\//.test(u)?u:""}
function rich(s){let t=esc(s);t=t.replace(/\[([^\]]+)\]\((https:\/\/[^)\s]+)\)/g,(m,a,u)=>'<a href="'+u+'" target="_blank" rel="noopener">'+a+'</a>');t=t.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");return t.replace(/\n/g,"<br>")}
async function getJson(q){const r=await fetch(HOOK+"?"+q);return r.json()}

const id=new URLSearchParams(location.search).get("id")||"";
const body=document.getElementById("body");
function render(blocks){
 let html="",open=false,tbl=false;
 const closeTbl=()=>{if(tbl){html+="</table>";tbl=false}};
 const card=h=>{closeTbl();if(open)html+="</div>";html+='<div class="card">'+(h?"<h2>"+esc(h)+"</h2>":"");open=true};
 blocks.forEach(b=>{
  if(b.t==="カード"){card(b.h);return}
  if(!open)card("");
  if(b.t!=="行")closeTbl();
  if(b.t==="日ラベル")html+='<div class="day">'+esc(b.h)+"</div>";
  else if(b.t==="本文")html+="<p>"+rich(b.b)+"</p>";
  else if(b.t==="注意枠")html+='<div class="callout">'+rich(b.b)+"</div>";
  else if(b.t==="行"){if(!tbl){html+="<table>";tbl=true}html+="<tr><th>"+esc(b.h)+"</th><td>"+rich(b.b)+"</td></tr>"}
  else if(b.t==="画像"){const u=safeUrl(b.img);if(u)html+='<figure class="shot"><a href="'+esc(u)+'" target="_blank" rel="noopener"><img src="'+esc(u)+'" alt="'+esc(b.b)+'" loading="lazy"></a>'+(b.b?"<figcaption>"+esc(b.b)+"</figcaption>":"")+"</figure>"}
  else if(b.t==="ボタン"){const u=safeUrl(b.u);if(u)html+='<a class="btn" href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(b.h)+"</a>"}
 });
 closeTbl();if(open)html+="</div>";
 return html;
}
let authReady;
function waitAuth(){if(!authReady)authReady=new Promise(r=>{const u=auth.onAuthStateChanged(x=>{u();r(x)})});return authReady}
async function post(payload){
 const user=await waitAuth();
 if(!user)throw new Error("ログインが確認できません。保護者メニューから開き直してください。");
 const idToken=await user.getIdToken();
 const r=await fetch(HOOK,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({idToken,eventId:id},payload))});
 return r.json();
}
function formCard(ev){
 const c=document.createElement("div");c.className="card";c.id="entry";
 c.innerHTML='<h2>参加の申込</h2><div id="ef"><div class="ld"><img src="icon-192.png" alt="" width="56" height="56"><span>確認しています…</span></div></div>';
 return c;
}
async function setupEntry(ev,card){
 const ef=card.querySelector("#ef");
 if(!ev.entryOpen){ef.innerHTML='<p class="note" style="margin:0">'+(ev.full?"定員に達したため、受付を終了しました。":"申込の受付は終了しました。")+"</p>";return}
 let mine;
 try{mine=await post({type:"eventMine"})}catch(e){ef.innerHTML='<p class="msg err">'+esc(e.message||"確認できませんでした")+"</p>";return}
 if(!mine.ok){ef.innerHTML='<p class="msg err">'+esc(mine.error||"確認できませんでした")+"</p>";return}
 const draw=()=>{
  const entered=mine.entered;
  ef.innerHTML='<p class="who"><b>'+esc(mine.name)+"</b> さんの申込です。"+(entered?"<br>申込済みです。内容を変える場合は、もう一度送信してください。":"")+"</p>"
   +(entered&&mine.answers?'<p class="note" style="margin:0 0 14px">現在の内容：'+esc(mine.answers)+"</p>":"")
   +ev.fields.map((f,i)=>'<div class="f"><label>'+esc(f.label)+(f.required?" (必須)":"")+"</label>"+(f.options.length?'<select data-l="'+esc(f.label)+'"><option value="">選択してください</option>'+f.options.map(o=>"<option>"+esc(o)+"</option>").join("")+"</select>":'<input data-l="'+esc(f.label)+'" maxlength="200">')+"</div>").join("")
   +'<div class="f"><label>連絡事項 (任意)</label><textarea id="nt" maxlength="300"></textarea></div>'
   +'<button class="btn" id="go" style="width:100%;border:0;cursor:pointer">'+(entered?"内容を更新する":"この内容で申し込む")+"</button>"
   +(entered?'<button class="btn" id="cx" style="width:100%;border:1px solid var(--blue);background:#fff;color:var(--blue);box-shadow:none;cursor:pointer">申込を取り消す</button>':"")
   +'<p class="msg" id="mg"></p>'+(ev.deadline?'<p class="note">申込期限：'+esc(ev.deadline.replace(/-/g,"/"))+"まで</p>":"");
  const mg=ef.querySelector("#mg"),go=ef.querySelector("#go");
  go.onclick=async()=>{
   const answers={};ef.querySelectorAll("[data-l]").forEach(x=>{answers[x.dataset.l]=x.value});
   go.disabled=true;mg.className="msg";mg.textContent="送信中です…";
   try{const r=await post({type:"eventEntry",answers,note:ef.querySelector("#nt").value});
    if(r.ok){mine.entered=true;mine.answers=Object.entries(answers).filter(e=>e[1]).map(e=>e[0]+"："+e[1]).join(" / ");draw();ef.querySelector("#mg").textContent="申込を受け付けました。";}
    else{mg.className="msg err";mg.textContent=r.error||"送れませんでした";go.disabled=false}
   }catch(e){mg.className="msg err";mg.textContent=e.message||"送れませんでした。電波の良い場所で、もう一度お試しください。";go.disabled=false}
  };
  const cx=ef.querySelector("#cx");
  if(cx)cx.onclick=async()=>{if(!confirm("申込を取り消しますか？"))return;cx.disabled=true;
   try{const r=await post({type:"eventCancel"});if(r.ok){mine.entered=false;mine.answers="";draw();ef.querySelector("#mg").textContent="申込を取り消しました。"}else{mg.className="msg err";mg.textContent=r.error||"取り消せませんでした";cx.disabled=false}}
   catch(e){mg.className="msg err";mg.textContent=e.message||"取り消せませんでした";cx.disabled=false}};
 };
 draw();
}
(async()=>{
 try{
  const j=await getJson("action=event&id="+encodeURIComponent(id));
  if(!j.ok){document.title="タクマ塾 イベントのご案内";document.getElementById("h1").textContent="このご案内は終了しました";body.innerHTML='<div class="card"><p>ご覧いただきありがとうございました。<br>現在ご案内中のイベントは、一覧からご確認ください。</p></div>';return}
  const ev=j.event;
  document.title="タクマ塾 "+ev.title;
  document.getElementById("h1").textContent=ev.title;
  document.getElementById("sub").textContent=range(ev.start,ev.end);
  body.innerHTML=render(j.blocks);
  if(ev.entryRequested){const c=formCard(ev);body.appendChild(c);setupEntry(ev,c)}
 }catch(e){document.getElementById("h1").textContent="読み込めませんでした";body.innerHTML='<div class="card"><p>電波の良い場所で、もう一度開いてください。</p></div>'}
})();
</script>
</body>
</html>
