<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>活動予定 - タクマ塾岩国校</title>
<style>
  :root{
    --bg:#F6F6F1; --surface:#FFFFFF; --border:#E1E7E7; --border-strong:#C7D2D2;
    --text-primary:#12181A; --text-secondary:#5B6668; --text-muted:#8A9799;
    --accent:#0FB8C4; --accent-dark:#0A8A93; --accent-bg:#E3F7F8;
    --danger:#D6483F; --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Hiragino Sans","Yu Gothic",-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:var(--text-primary);line-height:1.6;}
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 60px;}
  header{margin-bottom:18px;}
  header h1{font-size:19px;font-weight:700;margin:0 0 4px;}
  header p{font-size:13px;color:var(--text-secondary);margin:0;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 18px;margin-bottom:16px;}
  .status{font-size:13px;color:var(--text-secondary);text-align:center;padding:24px 0;}
  .row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--border);}
  .row:last-child{border-bottom:none;}
  .row.cancelled{opacity:0.5;}
  .r-date{width:60px;flex:0 0 60px;font-weight:700;font-size:13px;font-family:'Outfit',sans-serif;padding-top:1px;}
  .r-time{width:96px;flex:0 0 96px;font-size:13px;color:var(--text-secondary);padding-top:1px;}
  .r-body{flex:1 1 auto;font-size:13px;}
  .r-type{font-weight:700;margin-bottom:2px;}
  .r-loc, .r-staff{color:var(--text-secondary);margin-bottom:2px;}
  .r-note{color:var(--text-muted);font-size:12px;}
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--surface);color:var(--text-muted);font-weight:600;border:1px solid var(--border-strong);}
  .empty{color:var(--text-muted);font-size:13px;text-align:center;padding:30px 0;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>タクマ塾岩国校 活動予定</h1>
    <p>今日から60日間の練習・試合・イベント予定です(閲覧専用)。</p>
  </header>
  <div class="card">
    <div id="content"><div class="status">読み込んでいます…</div></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDKTuN49WGP1pFobS6rS_RwDnDvzJe1h00",
  authDomain: "takuma-juku-iwakuni.firebaseapp.com",
  projectId: "takuma-juku-iwakuni",
  storageBucket: "takuma-juku-iwakuni.firebasestorage.app",
  messagingSenderId: "1065956673618",
  appId: "1:1065956673618:web:e765409502a9b87031b78b"
};
const ACADEMY_ID = 'takuma-juku-iwakuni';

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const academyRef = db.collection('academies').doc(ACADEMY_ID);
const patternsRef = academyRef.collection('schedulePatterns');
const eventsRef = academyRef.collection('scheduleEvents');
const locationsMetaRef = academyRef.collection('meta').doc('locations');

let patterns = [];
let scheduleEvents = [];
let locationsList = [];

function pad(n){ return String(n).padStart(2,'0'); }
function escAttr(v){ return String(v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function dateStrOf(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function weekdayOf(dateStr){ return new Date(dateStr + 'T00:00:00').getDay(); }
const WEEKDAY_LABELS = ['日','月','火','水','木','金','土'];
function locationName(id){ const l = (locationsList||[]).find(x => x.id === id); return l ? l.name : ''; }

function occurrencesForDate(dateStr){
  const wd = weekdayOf(dateStr);
  const results = [];
  patterns.filter(p => Number(p.weekday) === wd
    && (!p.startDate || dateStr >= p.startDate)
    && (!p.endDate || dateStr <= p.endDate)
  ).forEach(p => {
    const override = scheduleEvents.find(e => e.date === dateStr && e.patternId === p.id);
    const merged = Object.assign({}, p, override || {});
    results.push({
      startTime: merged.startTime, endTime: merged.endTime, locationId: merged.locationId,
      staffInCharge: merged.staffInCharge, targetGroup: merged.targetGroup, type: merged.type, note: merged.note,
      cancelled: !!(override && override.cancelled)
    });
  });
  scheduleEvents.filter(e => e.date === dateStr && !e.patternId).forEach(e => {
    results.push({
      startTime:e.startTime, endTime:e.endTime, locationId:e.locationId,
      staffInCharge:e.staffInCharge, targetGroup:e.targetGroup, type:e.type, note:e.note,
      cancelled: !!e.cancelled
    });
  });
  results.sort((a,b) => (a.startTime||'').localeCompare(b.startTime||''));
  return results.map(o => Object.assign({ date:dateStr }, o));
}

function rowHTML(o){
  const d = new Date(o.date + 'T00:00:00');
  const dateLabel = (d.getMonth()+1) + '/' + d.getDate() + '(' + WEEKDAY_LABELS[d.getDay()] + ')';
  const cancelledTag = o.cancelled ? ' <span class="badge">中止</span>' : '';
  return `<div class="row ${o.cancelled ? 'cancelled' : ''}">
    <div class="r-date">${dateLabel}</div>
    <div class="r-time">${escAttr(o.startTime||'')}${o.endTime ? '〜'+escAttr(o.endTime) : ''}</div>
    <div class="r-body">
      <div class="r-type">${escAttr(o.type||'')}${cancelledTag}</div>
      <div class="r-loc">📍 ${escAttr(locationName(o.locationId) || '場所未設定')}</div>
      <div class="r-staff">対象: ${escAttr(o.targetGroup||'-')}</div>
      ${o.note ? '<div class="r-note">' + escAttr(o.note) + '</div>' : ''}
    </div>
  </div>`;
}

function render(){
  const container = document.getElementById('content');
  const today = new Date();
  const rows = [];
  for (let i = 0; i < 60; i++){
    const d = new Date(today); d.setDate(d.getDate() + i);
    occurrencesForDate(dateStrOf(d)).forEach(o => rows.push(o));
  }
  container.innerHTML = rows.length === 0
    ? '<p class="empty">今後60日間の予定はまだ登録されていません。</p>'
    : rows.map(rowHTML).join('');
}

async function init(){
  try {
    await auth.signInAnonymously();
  } catch(e){
    console.error(e);
    document.getElementById('content').innerHTML = '<p class="empty">読み込みに失敗しました。<br>エラー内容: ' + escAttr(e && e.code ? e.code : '') + ' ' + escAttr(e && e.message ? e.message : String(e)) + '</p>';
    return;
  }
  patternsRef.onSnapshot(snap => { patterns = snap.docs.map(d => Object.assign({ id:d.id }, d.data())); render(); }, err => {
    console.error(err);
    document.getElementById('content').innerHTML = '<p class="empty">予定データの読み込みに失敗しました。<br>エラー内容: ' + escAttr(err && err.code ? err.code : '') + ' ' + escAttr(err && err.message ? err.message : String(err)) + '</p>';
  });
  eventsRef.onSnapshot(snap => { scheduleEvents = snap.docs.map(d => d.data()); render(); }, err => console.error(err));
  locationsMetaRef.onSnapshot(doc => { locationsList = doc.exists ? (doc.data().items||[]) : []; render(); }, err => console.error(err));
}

init();
</script>
</body>
</html>
